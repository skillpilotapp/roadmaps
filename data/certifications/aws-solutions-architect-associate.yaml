faq:
  - question: Is the AWS Solutions Architect Associate exam hard?
    answer: It is not hard in the sense of obscure content — every option in a question is technically capable of the stated outcome, and the actual skill is finding the constraint in the stem, such as cheapest, most available or least operational overhead. Time pressure is not the failure mode, since 130 minutes for 65 questions is comfortable; misreading the constraint is what causes wrong answers.
  - question: What domains does the SAA-C03 exam cover, and what should I study first?
    answer: Design Secure Architectures is the largest domain at 30%, followed by Design Resilient Architectures at 26%, Design High-Performing Architectures at 24%, and Design Cost-Optimized Architectures at 20%. The security weight is AWS signalling that most wrong answers leak, over-permit or fail to encrypt something rather than simply not working, so that domain is worth studying first.
  - question: Where do most candidates lose points on the exam?
    answer: VPC design — subnets, route tables, NAT gateways, and security groups versus NACLs — appears across all four domains instead of one, so a weak mental model of it costs marks everywhere on the exam. The other common loss is picking the technically superior answer instead of the one matching the stated constraint, such as choosing better durability when the question asked for lowest cost.
  - question: How much does the AWS SAA-C03 exam cost, and how long is it valid?
    answer: The exam costs $150 USD, runs for 130 minutes across 65 questions (50 scored and 15 unscored), and requires a scaled score of 720 out of 1,000 to pass. The certification is valid for three years, and it can be taken at a Pearson VUE test centre or online with a proctor.
  - question: Do I need a year of AWS experience before taking the exam?
    answer: AWS recommends at least one year of hands-on experience designing solutions with AWS services, plus familiarity with networking fundamentals like subnets, routing, DNS and load balancing. It is achievable without that year if you build the core services yourself in a free-tier account, because the exam rewards decision-making over muscle memory.
  - question: What is the best way to prepare for the SAA-C03 exam?
    answer: Start with the official exam guide to learn the domain weightings, then work through the AWS Well-Architected Framework since its pillars map almost directly onto the exam domains. After that, build the core services by hand instead of just reading about them, drill scenario-based decision patterns, and finish with at least one timed full-length practice exam before booking.
