  - step: Sit a timed full-length practice exam
    description: 130 minutes for 65 questions is about two minutes each, and the long scenario stems consume that quickly. Take at least one full practice exam under timed conditions before booking. Scoring is compensatory — you need 720 overall and do not have to pass each domain individually.
