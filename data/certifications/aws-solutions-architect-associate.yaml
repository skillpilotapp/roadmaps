        type: course
        url: https://skillbuilder.aws/
        provider: AWS
        free: true
  - step: Drill the decision patterns the exam actually tests
    description: Questions are scenario-based and almost never ask what a service does. They ask which of four workable options is cheapest, or most resilient, or most secure. Practise reading the qualifier in the question stem first — 'most cost-effective' and 'highest availability' select different correct answers from identical scenarios.
    estimatedHours: 20
    resources:
