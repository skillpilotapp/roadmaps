        url: https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/welcome.html
        provider: AWS
        free: true
  - step: Build the core services rather than reading about them
    description: Most failures come from candidates who recognise service names but have never wired two together. Build a VPC by hand, put a load balancer in front of an Auto Scaling group, attach an RDS instance in a private subnet, and break each one on purpose. A free tier account covers nearly all of this.
    estimatedHours: 40
    resources:
