faq:
  - question: Is the AZ-104 exam hard?
    answer: "Its difficulty comes from breadth rather than depth: the weights are unusually flat, with identity and compute at 23% each and storage, networking and monitoring each at 18%, so no domain dominates and none can be skipped. That means five subjects at once, each with its own tooling, in a hundred minutes that feel tighter once interactive tasks are involved."
  - question: What domains does the AZ-104 exam cover, and where should I start?
    answer: The five domains are Manage Azure identities and governance (23%), Deploy and manage Azure compute resources (23%), Implement and manage storage (18%), Implement and manage virtual networking (18%), and Monitor and maintain Azure resources (18%). Identity is the right place to start regardless of the weights, because Microsoft Entra ID underpins the other four domains and role assignments show up in storage, compute and networking questions alike.
  - question: Where do most candidates lose points on the AZ-104 exam?
    answer: "Networking, for the same reason as every cloud exam: NSGs, route tables, peering and DNS resolution fail in ways that look alike from the portal, so building a two-VNet peering scenario and breaking it deliberately is worthwhile practice. Backup and recovery is the other gap — it spans storage and compute, belongs cleanly to neither in most study material, and is reliably examined."
  - question: Do I need to know PowerShell, the Azure CLI and Bicep, or just the portal?
    answer: All of them — the exam expects fluency across the portal, PowerShell, the Azure CLI and Bicep for the same task, because real administration mixes all four. Questions specify which tool to use, and the correct `az` flag is not the correct PowerShell parameter, so pick one tool for daily work but read each question carefully for which one it is asking about.
  - question: How much does the AZ-104 exam cost and how long does the certification last?
    answer: Pricing is regional, so Microsoft publishes the local price at checkout rather than a single figure. The passing score is 700 out of 1,000, and the certification is valid for 12 months, renewed free of charge through an unproctored online assessment on Microsoft Learn — shorter than the two- or three-year cycles elsewhere, but the renewal takes far less preparation and costs nothing.
  - question: What happens if I let my AZ-104 certification expire?
    answer: Renewal is available from six months before expiry and is free, taking only an unproctored online assessment on Microsoft Learn. But if you let it lapse instead of renewing on time, you have to retake the full paid exam, which is why it is worth treating the renewal as an annual habit and putting the date in a calendar the day you pass.
