faq:
  - question: Is the CCSP exam hard?
    answer: "It is hard in a way technical candidates do not expect: the material itself is not obscure, but a third of it is not technical at all. The exam rewards governance thinking over engineering thinking, and strong practitioners who pick the technically superior answer instead of the one a risk manager would sign off are the ones who resit."
  - question: What domains does the CCSP exam cover, and what should I study first?
    answer: Cloud Data Security is the largest domain at 20% and should come first — it covers vendor-neutral vocabulary like the data lifecycle, tokenisation, information rights management and retention policy, which trips up engineers fluent in only one provider's tooling. Architecture, Platform and Infrastructure and Operations follow at 17% each, Application Security at 16%, and Legal, Risk and Compliance at 13%.
  - question: Where do most candidates lose points on the CCSP exam?
    answer: "The most common failure is answering as an engineer rather than a risk manager: the exam consistently rewards governance thinking, and picking the technically superior answer over the one the framework prescribes costs marks. Legal, Risk and Compliance compounds this — it is the smallest domain at 13%, but jurisdiction, e-discovery, contract design and privacy regimes cannot be reasoned out from engineering knowledge and have to be memorised."
  - question: How much does the CCSP exam cost, and how long is it valid?
    answer: The exam costs $599 USD in the Americas region, per ISC2's pricing page. The certification runs on a three-year cycle that requires 90 CPE credits plus an annual maintenance fee, so it is a recurring commitment rather than a one-off purchase.
  - question: Do I need five years of experience before I can get CCSP certified?
    answer: CCSP requires five years of paid IT experience, three of them in information security and one in a CCSP domain. If you don't have it yet, you can still sit the exam and hold Associate of ISC2 status while you accrue the rest — but the prep path recommends deciding that deliberately rather than discovering the gap at endorsement.
  - question: What format is the CCSP exam, and what score do I need to pass?
    answer: The CCSP is a three-hour exam with 100 to 150 multiple choice and advanced items, taken at a Pearson VUE test centre, and the pass mark is 700 out of 1000 points. Scoring is scaled and compensatory, meaning a strong domain can offset a weak one, but only for items you actually answered — there's no penalty for guessing and no way to recover a blank item.
