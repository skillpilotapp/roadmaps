faq:
  - question: Is the CKA exam hard?
    answer: "It is hard in a specific way: the material is not obscure, but the exam is two hours of live command-line tasks against a real cluster, and most candidates who fail knew the content and typed too slowly. Time is the constraint, not knowledge — which is why the prep path treats shell setup (kubectl aliases, completion, --dry-run=client -o yaml) as day-one work rather than a detail."
  - question: What domains does the CKA exam cover, and what should I study first?
    answer: Troubleshooting is 30% of the score and Cluster Architecture, Installation & Configuration is 25% — together over half the exam. Study in that weight order rather than the official curriculum order, which starts with architecture but says nothing about where the marks actually are. The remaining 45% splits across Services & Networking (20%), Workloads & Scheduling (15%), and Storage (10%).
  - question: Where do most candidates lose marks on the CKA?
    answer: "Networking is the domain that surprises people: services, ingress and network policies fail in ways that look identical from kubectl get output but are diagnosed completely differently. etcd backup and restore is the opposite case — purely procedural and reliably present, which makes drilling it the highest-return single hour of preparation on the whole exam."
  - question: Can I use documentation during the CKA exam?
    answer: "Yes — the permitted resources are the kubernetes.io docs and the Gateway API docs, including translations, and you may search within them. It will not save an unprepared candidate: you may not open an external search result, and reading a page you have never read before costs minutes you do not have in a two-hour exam."
  - question: What happens if I fail the CKA on my first attempt?
    answer: The certification fee includes one free retake, and the credential is valid for two years once you pass. That changes the calculation — sitting the exam slightly under-prepared is a cheaper mistake than most certifications allow, and a first attempt tells you exactly which domains need more work before the retake.
  - question: Do I need a multi-node cluster to prepare for the CKA?
    answer: Yes. Single-node tools like kind or minikube work for practising deployments, but node-level failures — a kubelet that will not start, a node stuck NotReady — are roughly a third of the exam's Troubleshooting domain and cannot be reproduced with only one node. Setting up 2-3 VMs with kubeadm is the first step in the prep path for that reason.
