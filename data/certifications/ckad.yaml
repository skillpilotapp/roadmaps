          url: https://kubernetes.io/docs/concepts/
  - step: Drill the configuration and security domain — it is the largest
    description: "At 25% this is the biggest single block of marks, and it is almost all mechanical: mount a ConfigMap as a volume, inject a Secret as an env var, set a securityContext runAsUser, apply a resource quota. Practise each mounting style until you stop looking it up, because each lookup costs a minute you need elsewhere."
    estimatedHours: 22
