  validity: 2 years
  format: Online, proctored, performance-based — 15-20 command-line tasks on live Kubernetes clusters (v1.35)
domains:
  - name: Application Design and Build
    weight: 20
    topics:
      - Define, build and modify container images
      - Choosing the right workload resource (Deployment, DaemonSet, CronJob)
      - Multi-container Pod design patterns — sidecar, init and others
      - Persistent and ephemeral volumes
  - name: Application Deployment
    weight: 20
    topics:
      - Deployments and rolling updates
      - Common deployment strategies — blue/green and canary
      - Deploying existing packages with Helm
      - Kustomize overlays and patches
  - name: Application Observability and Maintenance
    weight: 15
    topics:
      - API deprecations
      - Liveness, readiness and startup probes
      - Monitoring applications with the built-in CLI tools
      - Container logs
      - Debugging in Kubernetes
  - name: Application Environment, Configuration and Security
    weight: 25
    topics:
      - Resources that extend Kubernetes — CRDs and Operators
      - Authentication, authorization and admission control
      - Requests, limits and quotas
      - ConfigMaps, Secrets and ServiceAccounts
      - Application security — SecurityContexts and capabilities
  - name: Services and Networking
    weight: 20
    topics:
      - NetworkPolicies
      - Providing and troubleshooting access to applications via Services
      - Exposing applications with Ingress rules
prepPath:
  - step: Set up a throwaway cluster and a fast shell
    description: One kind cluster is enough — you never touch a control plane in this exam. Spend the time instead on the kubectl alias, completion and the --dry-run=client -o yaml habit. Candidates lose CKAD on typing speed, so make the shortcuts automatic from day one and use them for every step below.
    estimatedHours: 4
    resources:
      - title: kind (Kubernetes in Docker)
        type: documentation
        url: https://kind.sigs.k8s.io/
        provider: Kubernetes SIGs
        free: true
      - title: kubectl Quick Reference — aliases, completion, dry-run
        type: documentation
        url: https://kubernetes.io/docs/reference/kubectl/quick-reference/
        provider: Kubernetes
        free: true
      - title: CKAD Curriculum v1.35 (official)
        type: documentation
        url: https://github.com/cncf/curriculum
        provider: CNCF
        free: true
  - step: Learn Pods, workload resources and multi-container patterns
    description: The first 20%. Know which workload resource fits a described job — a batch task is a Job, a nightly task is a CronJob — and be able to write an init container and a sidecar from memory. These are generated fast with kubectl run and then edited, not typed from scratch.
    estimatedHours: 20
    resources:
      - title: Pods
        type: documentation
