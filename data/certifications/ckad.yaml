  - step: Cover deployment, Helm and Kustomize
    description: Rolling updates and rollbacks are reliable marks. Blue/green and canary are asked as primitives — two Deployments and a Service selector you edit — not as a product feature. Helm appears as install, upgrade and rollback of an existing chart, so learn the CLI rather than chart authoring.
