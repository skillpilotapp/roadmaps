  - step: Cover networking, probes and debugging
    description: Services, Ingress and NetworkPolicies are 20%, and observability another 15%. Deliberately break your own app — wrong selector, wrong targetPort, a probe that fails — and fix it from kubectl describe and logs alone. That symptom-to-cause mapping is what makes the debugging tasks quick.
