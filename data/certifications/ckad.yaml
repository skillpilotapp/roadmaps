faq:
  - question: Is the CKAD exam hard?
    answer: "The difficulty is almost entirely execution under a clock, not concept difficulty: 15-20 tasks in 120 minutes is roughly six minutes each, and most people who fail knew every concept involved but typed too slowly or wrote YAML by hand instead of generating it. Nothing in the curriculum is obscure — it is core Kubernetes objects you already use if you deploy to Kubernetes at work."
  - question: Should I take the CKAD or the CKA?
    answer: CKAD is about the application on the cluster — manifests, ConfigMaps and Secrets, probes, exposing a Deployment through a Service and Ingress — while CKA is about running the cluster itself, including bootstrapping, etcd and a broken kubelet. Pick CKAD if you ship services onto a cluster someone else runs, and if you plan to do both, take CKAD first since it is the gentler exam and most of its material is a prerequisite for the CKA.
  - question: What domains does the CKAD exam cover, and which one carries the most weight?
    answer: Application Environment, Configuration and Security is the largest single block at 25%, covering CRDs and Operators, authentication and admission control, resource quotas, ConfigMaps, Secrets, ServiceAccounts and SecurityContexts. The rest splits across Application Design and Build (20%), Application Deployment (20%), Services and Networking (20%), and Application Observability and Maintenance (15%).
  - question: Can I use documentation during the CKAD exam?
    answer: Yes — kubernetes.io/docs, the Kubernetes blog and helm.sh/docs are open and you may search within them, but you may not open an external search result. Two or three lookups are fine, but ten will cost you the exam, since each one eats into the roughly six minutes you have per task.
  - question: How much does the CKAD exam cost, and what happens if I fail?
    answer: The exam costs $445 USD, which includes one free retake and twelve months to schedule it, and the certification stays valid for two years once you pass. That makes a slightly early first attempt a cheap way to find out which domains still need work.
  - question: What should my CKAD prep path actually cover?
    answer: Start with a throwaway kind cluster and fast shell habits like kubectl aliases and --dry-run=client -o yaml, then work through Pods and multi-container patterns, the configuration and security domain, deployment strategies with Helm and Kustomize, and networking, probes and debugging. Finish with timed simulations, scoring yourself on how many tasks you finished rather than just how many you got right, since unfinished tasks are the usual failure mode.
