  - step: Drill the pod-level controls until you can write them from memory
    description: Pod Security Standards, security contexts, seccomp, AppArmor, secrets encryption at rest and sandboxed runtimes are the 20% Microservice Vulnerabilities domain plus half of System Hardening. Every one is a small YAML block, and writing them without the docs open is the difference between finishing and running out of time.
