  - step: Harden a cluster you built yourself against the CIS benchmark
    description: Run kube-bench against your own kubeadm cluster, then fix what it flags — API server flags, kubelet configuration, etcd permissions. This is Cluster Setup and Cluster Hardening, 30% of the exam, and reading about the controls teaches you far less than watching a check flip to PASS.
