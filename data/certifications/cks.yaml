faq:
  - question: Is the CKS exam hard?
    answer: "It is the hardest of the three CNCF Kubernetes exams, and the reason is structural: it assumes everything the CKA tested and then asks you to do it under an adversarial framing, in the same two hours. What actually fails people is tool breadth rather than Kubernetes depth — Falco, Trivy, kube-bench, Kyverno, cosign, AppArmor, seccomp and gVisor all appear, and meeting any of them for the first time in the exam loses that task."
  - question: Do I need to pass the CKA before I can take the CKS?
    answer: Yes. You must have passed the CKA before you may attempt the CKS — this is not a recommendation, the Linux Foundation checks it, and a lapsed CKA (they expire after two years) means renewing it before you can even book. Since 18 June 2026, passing the CKS also reinstates or extends an expired CKA under the CARE program, but that is a reward for passing, not a way around the entry requirement.
  - question: What domains does the CKS exam cover, and which ones should I focus on?
    answer: Three domains are weighted 20% each — Minimize Microservice Vulnerabilities, Supply Chain Security, and Monitoring, Logging and Runtime Security — and together they are 60% of the score, plus they're the ones a CKA holder has least exposure to. Cluster Setup and Cluster Hardening, at 15% each, and System Hardening at 10%, are closer to familiar ground from CKA study.
  - question: How much does the CKS certification cost, and how long is it valid?
    answer: The exam alone costs $445 USD, with bundles at $625 USD including THRIVE-ONE or $645 USD including the LFS260 course. It runs 2 hours, requires a 67% passing score, and is valid for 2 years — the same window as the CKA, and since June 2026 a CKS pass also extends the linked CKA to the same expiry date.
  - question: Why is supply chain security singled out as the hardest part to prepare for?
    answer: "Supply chain is where the gap is widest for most candidates: scanners, signatures, SBOMs and admission policy are day-job tools for very few Kubernetes administrators, yet the Supply Chain Security domain alone is worth as much as Cluster Hardening and System Hardening combined. The prep path has a dedicated step for it — scanning images with Trivy, cutting a base image to distroless, signing with cosign and enforcing a permitted-registry policy with Kyverno."
  - question: What documentation can I use during the CKS exam?
    answer: Eight documentation domains are allowed during the exam — kubernetes.io, Falco, Cilium, Istio, etcd, bom, ingress-nginx and the Kubernetes blog — compared to just one for the CKA. That is more places to get lost, not a safety net, since the extra breadth does not come with any extra time to read.
