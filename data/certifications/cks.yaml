  - step: Read the curriculum and the security checklist end to end
    description: The CNCF publishes the exact competency list, and the Kubernetes security checklist maps almost one-to-one onto it. Read both before studying anything, so you know which of the six domains you already cover from CKA work and which are genuinely new ground.
