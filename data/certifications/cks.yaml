    description: Scan images with Trivy, cut a base image down to distroless, sign an artifact with cosign and enforce a permitted-registry policy with Kyverno. Supply Chain Security is 20% and the tools are unfamiliar to most CKA holders, which makes it the domain where preparation pays back fastest.
