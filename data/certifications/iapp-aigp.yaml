  - step: Learn the NIST AI RMF and the ISO standards by structure
    description: The blueprint names NIST's four core functions and ISO/IEC 22989, 42001 and 42005 explicitly. Questions test structure and purpose, not clause detail — know what Govern, Map, Measure and Manage each cover, and which ISO standard does terminology, management systems and impact assessment.
