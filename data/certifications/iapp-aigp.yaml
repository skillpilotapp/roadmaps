faq:
  - question: Does the AIGP certification teach you to build or secure AI systems?
    answer: No — the AIGP is a governance credential that tests whether you can navigate AI regulation, risk frameworks and life-cycle controls, not whether you can build, evaluate or secure a model. If your interest is adversarial robustness, evaluation or model security, this certification is not the right target.
  - question: How much does the AIGP exam actually cost once you include maintenance?
    answer: "The exam itself is $799 non-member or $649 as an IAPP member, but passing does not make you certified: the credential only activates once you hold membership or pay a $250 maintenance fee every two-year term, plus 20 CPE credits per term. Membership at $295/year covers that fee and cuts the exam price by $150, so it usually pays for itself on the first sitting — a failed first attempt costs $625 non-member or $475 member to retake."
  - question: Is the AIGP passing score a percentage?
    answer: No. The exam is scaled from 100 to 500, and 300 passes — this is not 60%, because the scale maps raw correct answers onto a fixed range so different exam forms are comparable. Fifteen of the 100 questions are unscored trial items you cannot identify, so you cannot know what the raw score bar actually is.
  - question: What are the four AIGP exam domains and how are they weighted?
    answer: Understanding how to govern AI development and Understanding how to govern AI deployment and use are each 27% of the exam, together over half the content. The remaining weight splits between Understanding how laws, standards and frameworks apply to AI (25%) and Understanding the foundations of AI governance (21%), and these percentages come from SkillPilot's own arithmetic on the official Body of Knowledge question ranges, not an IAPP-published figure.
  - question: Who should actually get the AIGP certification?
    answer: It's worth it if AI governance is your job or is becoming it — privacy and compliance professionals extending into AI, risk and legal teams, engineers who have moved into policy work or sit on an AI review board, and consultants who need the credential on a proposal. Skip it if you build systems, since it will not make you a better ML engineer or prove you can secure a model.
  - question: Are there any prerequisites to sit the AIGP exam?
    answer: There are no formal prerequisites — the IAPP does not require prior certification or experience to register. It helps to have a working understanding of how machine learning systems are built and deployed, and prior exposure to a regulatory or compliance framework such as GDPR.
