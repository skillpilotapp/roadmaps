        type: documentation
        url: https://iapp.org/ai-governance
        provider: IAPP
        free: true
  - step: Work through the EU AI Act by risk tier
    description: The Act is the single largest source of legal questions. Do not read it front to back. Learn the four risk tiers, what falls into each, and the specific obligations attached — then the general-purpose AI model rules, the enforcement regime and how duties differ by role.
    estimatedHours: 20
    resources:
