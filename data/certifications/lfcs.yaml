faq:
  - question: Is the LFCS exam hard?
    answer: "It is performance-based rather than multiple choice: you get two hours at a command line on a live Linux system and each task is graded on the resulting state of the machine, not on a guess. The pass mark is 67%, so it rewards candidates who can move fast with only man pages and --help as reference, not just those who know the material."
  - question: What domains does the LFCS exam cover, and what should I study first?
    answer: Operations Deployment and Networking are 25% each, so half the exam sits in services, packages, containers, SELinux, firewalls and SSH. Storage and Essential Commands are worth 20% each, and Users and Groups only 10% — the opposite weighting from what most Linux courses teach first, so the prep path works Operations Deployment and Networking before the rest.
  - question: Where do most candidates lose points on the exam?
    answer: Persistence and careless reading. A kernel parameter set with sysctl but never written to a config file, a mount that works now and disappears on reboot, or an fstab typo that would leave the machine unbootable are all common and silent mistakes. The fix is to verify by re-reading the config file you wrote rather than trusting that the command you just ran worked.
  - question: Is the LFCS tied to a specific Linux distribution?
    answer: No. The 2023 revision made the exam distribution-agnostic, so you no longer choose a platform when you register. That means preparation should focus on the portable way of doing something and on knowing where distributions actually diverge, such as the package manager, the firewall front-end, or whether SELinux or AppArmor is in charge.
  - question: What happens if I fail the LFCS on my first attempt?
    answer: The exam fee includes one free retake, and the certification stays valid for two years once you pass. That makes an early, slightly under-prepared attempt a cheap way to find out which of the five domains needs real work, and given the 67% pass mark a first sitting is often closer than it feels.
  - question: Do I need a virtual machine to prepare for the LFCS?
    answer: Yes, and it should be a VM you are willing to destroy rather than a container. Roughly half the exam covers kernel parameters, LVM, swap and networking, none of which behave normally inside a container, so the prep path starts with snapshotting a fresh VM install to break and roll back repeatedly.
