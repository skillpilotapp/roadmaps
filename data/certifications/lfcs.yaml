domains:
  - name: Operations Deployment
    weight: 25
    topics:
      - Configure kernel parameters, persistent and non-persistent
      - Diagnose, identify, manage, and troubleshoot processes and services
      - Manage or schedule jobs for executing commands
      - Search for, install, validate, and maintain software packages or repositories
      - Recover from hardware, operating system, or filesystem failures
      - Manage virtual machines (libvirt)
      - Configure container engines, create and manage containers
      - Create and enforce MAC using SELinux
  - name: Networking
    weight: 25
    topics:
      - Configure IPv4 and IPv6 networking and hostname resolution
      - Set and synchronize system time using time servers
      - Monitor and troubleshoot networking
      - Configure the OpenSSH server and client
      - Configure packet filtering, port redirection, and NAT
      - Configure static routing
      - Configure bridge and bonding devices
      - Implement reverse proxies and load balancers
  - name: Storage
    weight: 20
    topics:
      - Configure and manage LVM storage
      - Manage and configure the virtual file system
      - Create, manage, and troubleshoot filesystems
      - Use remote filesystems and network block devices
      - Configure and manage swap space
      - Configure filesystem automounters
      - Monitor storage performance
  - name: Essential Commands
    weight: 20
    topics:
      - Basic Git operations
      - Create, configure, and troubleshoot services
      - Monitor and troubleshoot system performance and services
      - Determine application and service specific constraints
      - Troubleshoot disk space issues
      - Work with SSL certificates
  - name: Users and Groups
    weight: 10
    topics:
      - Create and manage local user and group accounts
      - Manage personal and system-wide environment profiles
      - Configure user resource limits
      - Configure and manage ACLs
      - Configure the system to use LDAP user and group accounts
prepPath:
  - step: Get a throwaway VM you are willing to destroy
    description: "Two VMs, not a container: half the exam is kernel parameters, LVM, swap and networking, none of which behave normally inside a container. Snapshot the fresh install so you can break it repeatedly and roll back in seconds instead of reinstalling."
    estimatedHours: 4
    resources:
      - title: LFCS certification page and domain list
        type: documentation
        url: https://training.linuxfoundation.org/certification/linux-foundation-certified-sysadmin-lfcs/
        provider: The Linux Foundation
        free: true
      - title: multipass — instant Ubuntu VMs
        type: documentation
        url: https://canonical.com/multipass/docs
        provider: Canonical
        free: true
      - title: Fedora Server documentation
        type: documentation
        url: https://docs.fedoraproject.org/en-US/fedora-server/
        provider: Fedora Project
        free: true
  - step: Learn to read man pages under time pressure
    description: The exam gives you the system's own documentation and nothing else. Practise finding a flag in man and --help rather than recalling it, because that is the skill the format actually tests, and it is the difference between a two-minute task and a ten-minute one.
    estimatedHours: 6
    resources:
      - title: man-pages project
        type: documentation
        url: https://www.kernel.org/doc/man-pages/
        provider: kernel.org
        free: true
      - title: The Linux Command Line
        type: book
        provider: William Shotts
        free: false
        isbnAsin: "1593279523"
        year: 2019
        freeAlternative:
          title: The Linux Command Line (free PDF from the author)
          url: https://linuxcommand.org/tlcl.php
  - step: Work Operations Deployment and Networking first
    description: They are 50% of the score between them and the two you cannot cram — systemd unit files, package repositories, nftables rules and SELinux contexts all need repetition. Curriculum order buries networking near the end; weight order does not.
    estimatedHours: 40
    resources:
      - title: systemd.service(5) — unit file manual
        type: documentation
        url: https://man7.org/linux/man-pages/man5/systemd.service.5.html
        provider: man7.org
        free: true
      - title: nftables wiki
        type: documentation
        url: https://wiki.nftables.org/wiki-nftables/index.php/Main_Page
        provider: Netfilter
        free: true
      - title: SELinux Project wiki
        type: documentation
        url: https://github.com/SELinuxProject/selinux/wiki
        provider: SELinux Project
        free: true
      - title: OpenSSH manual pages
        type: documentation
        url: https://www.openssh.com/manual.html
        provider: OpenSSH
        free: true
  - step: Drill LVM and filesystems until the sequence is automatic
    description: "Storage is 20% and almost entirely procedural: pvcreate, vgcreate, lvcreate, mkfs, a correct fstab entry, mount. It is the domain where a prepared candidate reliably banks full marks, and where a hesitant one burns the time the rest of the exam needs."
    estimatedHours: 12
    resources:
      - title: lvm(8) — logical volume manager manual
        type: documentation
        url: https://man7.org/linux/man-pages/man8/lvm.8.html
        provider: man7.org
        free: true
      - title: Arch Wiki — LVM
        type: documentation
        url: https://wiki.archlinux.org/title/LVM
        provider: Arch Linux
        free: true
      - title: Arch Wiki — fstab
        type: documentation
        url: https://wiki.archlinux.org/title/Fstab
        provider: Arch Linux
        free: true
  - step: Break the machine on purpose, then fix it
    description: Corrupt fstab so it will not boot. Fill the disk. Stop a service another one depends on. Recovering from a failure you caused teaches the symptom-to-cause mapping far faster than reading, and 'recover from filesystem failures' is a named competency.
    estimatedHours: 10
    resources:
      - title: systemd.special(7) — rescue and emergency targets
        type: documentation
        url: https://man7.org/linux/man-pages/man7/systemd.special.7.html
        provider: man7.org
        free: true
      - title: journalctl(1) manual
        type: documentation
        url: https://man7.org/linux/man-pages/man1/journalctl.1.html
        provider: man7.org
        free: true
  - step: Sit a timed two-hour run before you book
    description: Write yourself fifteen tasks across all five domains, set a timer and allow only the system's own documentation. The result tells you whether you are short on knowledge or short on speed, and those two problems have completely different fixes.
    estimatedHours: 6
