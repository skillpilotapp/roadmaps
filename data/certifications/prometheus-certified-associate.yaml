faq:
  - question: Is the Prometheus Certified Associate exam hard?
    answer: It is a knowledge exam, and an easy one — sixty multiple-choice and multiple-select questions in ninety minutes, and everything it tests is published free on prometheus.io. It does not prove you can operate Prometheus at scale, only that you have read the documentation carefully, so treat the badge as a side effect of studying rather than the goal itself.
  - question: What is the PCA exam actually good for?
    answer: Its real value is forcing you to learn PromQL properly — rate versus irate, aggregation over time versus over dimensions, vector matching and histogram_quantile — instead of copying four queries from dashboards someone else built. Those skills are genuinely useful the day after you pass, even though the badge itself is a weak, beginner-level, closed-book signal.
  - question: Which domain should I spend the most time studying for the PCA?
    answer: PromQL is weighted 28%, the heaviest domain, and it is the only one you cannot pass by reading alone — you need to write queries against a live server. If you have twenty hours to study, plan on spending roughly ten of them on PromQL specifically.
  - question: What topics do candidates most often forget to study for the PCA?
    answer: Observability Concepts is 18% of the exam, covering logs, traces, spans, push versus pull collection, and SLO/SLI/SLA basics, but these topics are barely mentioned on prometheus.io. Candidates who study only the Prometheus docs walk in having skipped nearly a fifth of the exam, so this material needs a vendor-neutral source instead.
  - question: Can I use documentation during the Prometheus Certified Associate exam?
    answer: "No. The PCA is closed-book: no documentation, no running Prometheus instance, and no browser tabs are allowed, which is the opposite of exams like the CKA. That means memorising function names rather than knowing where to look them up."
  - question: How much does the PCA cost and what is the passing score?
    answer: The exam costs $250 USD and includes one free retake, or $299 USD bundled with the LFS241 course. The passing score is 75%, which is 45 of 60 questions, so fifteen wrong answers is the whole margin, and multiple-select questions score all-or-nothing; the certification stays valid for two years with no maintenance fee.
