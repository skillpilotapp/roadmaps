        type: documentation
        url: https://github.com/cncf/curriculum
        provider: CNCF
        free: true
  - step: Learn the data model, labels and exposition format exactly
    description: Counter, gauge, histogram and summary, and what each one is for. This is 20% of the exam and it is where precise wording matters — questions distinguish a counter from a gauge, and a histogram from a summary, on details that are easy to half-know.
    estimatedHours: 10
