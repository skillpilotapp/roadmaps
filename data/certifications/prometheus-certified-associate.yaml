domains:
  - name: PromQL
    weight: 28
    topics:
      - Selecting data with instant and range vector selectors
      - Rates and derivatives
      - Aggregating over time
      - Aggregating over dimensions
      - Binary operators and vector matching
      - Histograms and quantile calculation
      - Timestamp metrics
  - name: Prometheus Fundamentals
    weight: 20
    topics:
      - System architecture
      - Configuration and scraping
      - Understanding Prometheus limitations
      - Data model and labels
      - Exposition format
  - name: Observability Concepts
    weight: 18
    topics:
      - Metrics
      - Logs and events
      - Tracing and spans
      - Push versus pull collection
      - Service discovery
      - Basics of SLOs, SLAs and SLIs
  - name: Alerting & Dashboarding
    weight: 18
    topics:
      - Dashboarding basics
      - Configuring alerting rules
      - Understanding and using Alertmanager
      - Alerting basics — when, what and why to alert
  - name: Instrumentation and Exporters
    weight: 16
    topics:
      - Client libraries
      - Instrumenting application code
      - Exporters and when to use one
      - Structuring and naming metrics
prepPath:
  - step: Run Prometheus locally before reading about it
    description: Download the binary, scrape itself and node_exporter, and open the expression browser. Two hours of a running server makes the architecture questions trivial later — targets, scrape intervals and the /metrics endpoint stop being abstractions once you have watched them work.
    estimatedHours: 6
    resources:
