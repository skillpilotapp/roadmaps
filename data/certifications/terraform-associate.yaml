domains:
  - name: Infrastructure as Code (IaC) with Terraform
    weight: 8
    topics:
      - Explain what IaC is
      - Describe the advantages of IaC patterns
      - Explain how Terraform manages multi-cloud and hybrid-cloud workflows
  - name: Terraform Fundamentals
    weight: 11
    topics:
      - Install and version Terraform providers
      - Describe how Terraform uses providers
      - Write configuration using multiple providers
      - Explain how Terraform uses and manages state
  - name: Core Terraform Workflow
    weight: 19
    topics:
      - Describe the Terraform workflow
      - Initialize a Terraform working directory
      - Validate a Terraform configuration
      - Generate and review an execution plan
      - Apply changes to infrastructure
      - Destroy Terraform-managed infrastructure
      - Apply formatting and style conventions
  - name: Terraform Configuration
    weight: 22
    topics:
      - Use and differentiate resource and data blocks
      - Reference resource attributes and create cross-resource references
      - Use variables and outputs
      - Understand and use complex types
      - Write dynamic configuration using expressions and functions
      - Define resource dependencies
      - Validate configuration using custom conditions
      - Apply best practices for managing sensitive data
  - name: Terraform Modules
    weight: 11
    topics:
      - Explain how Terraform sources modules
      - Describe variable scope within modules
      - Use modules in configuration
      - Manage module versions
  - name: Terraform State Management
    weight: 11
    topics:
      - Describe the local backend
      - Describe state locking
      - Configure remote state using the backend block
      - Manage resource drift and Terraform state
  - name: Maintain Infrastructure with Terraform
    weight: 8
    topics:
      - Import existing infrastructure into a Terraform workspace
      - Use the CLI to inspect state
      - Describe when and how to use verbose logging
  - name: HCP Terraform
    weight: 10
    topics:
      - Use HCP Terraform to create infrastructure
      - Describe HCP Terraform collaboration and governance features
      - Organize and use HCP Terraform workspaces and projects
      - Configure and use HCP Terraform integrations
prepPath:
  - step: Install Terraform and run the core workflow end to end
    description: Install the Terraform CLI, write a minimal configuration for a single resource, and run init, validate, plan, apply, and destroy so the core workflow is muscle memory before you study anything else.
    estimatedHours: 4
    resources:
      - title: Terraform CLI Documentation
        type: documentation
        url: https://developer.hashicorp.com/terraform/cli
        provider: HashiCorp
        free: true
  - step: Study the official exam objectives in order
    description: Work through HashiCorp's own exam review tutorial covering all 8 objectives, since it is the closest thing to an official study outline HashiCorp publishes.
    estimatedHours: 20
    resources:
      - title: Terraform Associate 004 Exam Review
        type: tutorial
        url: https://developer.hashicorp.com/terraform/tutorials/certification-004/associate-review-004
        provider: HashiCorp
        free: true
  - step: Build a multi-resource configuration with variables, outputs, and a module
    description: Write a configuration provisioning at least 3 related resources, using input variables and outputs, and calling one reusable module. Configuration language and modules together are the largest share of the exam, and the questions test whether you have written this rather than read about it.
    estimatedHours: 10
    resources:
      - title: Terraform Module Documentation
        type: documentation
        url: https://developer.hashicorp.com/terraform/language/modules
        provider: HashiCorp
        free: true
      - title: Terraform Registry — public modules
        type: documentation
        url: https://registry.terraform.io/
        provider: HashiCorp
        free: true
      - title: Terraform Language Documentation
        type: documentation
        url: https://developer.hashicorp.com/terraform/language
        provider: HashiCorp
        free: true
      - title: "Terraform: Up & Running"
        type: book
        provider: Yevgeniy Brikman
        free: false
        isbnAsin: "1098116747"
        year: 2022
        freeAlternative:
          title: Terraform Documentation
          url: https://developer.hashicorp.com/terraform/docs
  - step: Configure remote state and practise state operations
    description: Set up a remote backend, cause state drift deliberately, and recover from it with terraform state and terraform import. State is where the exam separates people who have run Terraform on a team from people who have run it alone — locking, drift and import only come up when someone else is also applying.
    estimatedHours: 8
    resources:
      - title: Terraform State Documentation
        type: documentation
        url: https://developer.hashicorp.com/terraform/language/state
        provider: HashiCorp
        free: true
      - title: State Locking
        type: documentation
        url: https://developer.hashicorp.com/terraform/language/state/locking
        provider: HashiCorp
        free: true
      - title: Import existing infrastructure
        type: tutorial
        url: https://developer.hashicorp.com/terraform/tutorials/state/state-import
        provider: HashiCorp
        free: true
  - step: Learn what each CLI command does to state, not just what it outputs
    description: The exam asks which command you would use in a described situation. taint, replace, refresh, -target and the state subcommands all get tested, and knowing the flag is not the same as knowing what it changes on disk.
    estimatedHours: 6
    resources:
      - title: Terraform CLI Command Reference
        type: documentation
        url: https://developer.hashicorp.com/terraform/cli/commands
        provider: HashiCorp
        free: true
      - title: Manage resources in state
        type: tutorial
        url: https://developer.hashicorp.com/terraform/tutorials/state/state-cli
        provider: HashiCorp
        free: true
  - step: Cover HCP Terraform and the workflow questions
    description: A recurring share of the exam is about HashiCorp's own platform — workspaces, remote runs, private registry, Sentinel policies — and about when a team workflow beats a local one. It is the part candidates who only use Terraform solo consistently miss.
    estimatedHours: 6
    resources:
      - title: HCP Terraform Documentation
        type: documentation
        url: https://developer.hashicorp.com/terraform/cloud-docs
        provider: HashiCorp
        free: true
      - title: Terraform Workspaces
        type: documentation
        url: https://developer.hashicorp.com/terraform/language/state/workspaces
        provider: HashiCorp
        free: true
  - step: Sit the official sample questions under time
    description: One hour for the real thing, so practise at that pace. Review the reasoning behind every answer, including the ones you got right — the exam distinguishes between plausible options rather than between right and obviously wrong ones.
    estimatedHours: 4
    resources:
      - title: Terraform Associate 004 Sample Questions
        type: tutorial
        url: https://developer.hashicorp.com/terraform/tutorials/certification-004/associate-questions-004
        provider: HashiCorp
        free: true
      - title: Terraform Associate 004 Study Guide
        type: tutorial
        url: https://developer.hashicorp.com/terraform/tutorials/certification-004/associate-study-004
        provider: HashiCorp
        free: true
