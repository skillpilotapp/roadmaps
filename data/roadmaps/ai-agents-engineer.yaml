  - id: tool-use
    title: Tool Use & Function Calling
    description: "The smallest complete agent: one model, one tool, one decision about whether to call it. Done when your agent picks the right tool for ambiguous requests and recovers when a tool returns an error instead of stopping or inventing a result. The tool description matters more than its implementation — it is what the model actually reasons over."
    duration: 1-2 months
