faq:
  - question: How long does it take to become an AI agents engineer?
    answer: Expect 9-14 months across eight phases, from LLM and programming foundations through tool use, orchestration, evaluation, production deployment, multi-agent systems, enterprise integration and a final specialization portfolio. The named frameworks in each phase are a current starting point rather than a permanent stack — the field moves, but tool design, evaluation rigour and failure analysis transfer.
  - question: What makes building AI agents different from regular software engineering?
    answer: The same input does not produce the same output, so unit tests asserting exact values and bugs that reliably reproduce stop holding. A conventional bug throws an error, while an agent instead produces something plausible and wrong, confidently, and a user may act on it before anyone notices — which is why evaluation and safety come before production deployment in this roadmap.
  - question: Why does reliability drop so much when an agent chains multiple steps?
    answer: A single call at 95% reliability is usually fine on its own, but ten chained calls at 95% each land near 60% end to end. That arithmetic is what the Agent Orchestration & Memory phase is built around, and it is why the roadmap treats task decomposition and per-step success measurement as core skills rather than optional polish.
  - question: What do I need to know before starting this roadmap?
    answer: You should be proficient in Python and comfortable working with REST APIs and JSON. The path assumes you have not built agentic systems yet, but if you have used an LLM API for a chatbot or a summariser, you already have a running start.
  - question: How much can an AI agents engineer earn?
    answer: In the United States, entry-level roles average around $101,541, rising to about $147,289 at mid-level and $164,244 for senior AI agent engineers, based on Glassdoor salary estimates. These figures cover the full career arc the roadmap targets, from someone finishing the foundational phases through a senior specialist with a shipped production portfolio.
  - question: Why does evaluation come before production deployment in this roadmap?
    answer: With non-deterministic output, "it seemed better" is not measurement — an evaluation harness is what tells you whether a prompt change actually helped, including cases where it helped one thing and broke another. That is why Evaluation, Safety & Guardrails is its own phase placed deliberately before Production Deployment & Observability, rather than treated as a late-stage checklist item.
