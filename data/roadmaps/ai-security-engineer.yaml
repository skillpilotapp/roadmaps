  - id: rag-data-boundary
    title: RAG & Data Boundary Security
    description: Retrieval makes the vector store part of your attack surface and your access-control problem. Embeddings ignore the permissions of the documents they came from, so the default failure is a user retrieving content they were never allowed to read. Done when retrieval in a system you own enforces per-user authorisation at query time, proved by a test where two users ask the same question and get different documents.
    duration: 3-4 weeks
    skills:
      - name: Retrieval Access Control
        level: advanced
        category: core
      - name: Vector Store Security
        level: advanced
        category: core
      - name: Document-level Permissions
        level: advanced
        category: core
      - name: Embedding Weaknesses
        level: advanced
        category: core
      - name: Multi-tenant Isolation
        level: advanced
        category: core
      - name: Knowledge Base Poisoning Defence
        level: advanced
        category: core
      - name: Data Classification
        level: intermediate
        category: core
      - name: Ingestion Pipeline Validation
        level: advanced
        category: core
    projects:
      - Enforce per-user authorisation at retrieval time, then prove it by having two users with different entitlements ask the same question
      - Audit an existing vector store for documents whose source permissions were lost at ingestion — the count is usually not zero
      - Implement tenant isolation in a shared vector store and verify a query from one tenant cannot surface another's chunks
      - Add validation and provenance tracking to your ingestion pipeline so an untrusted document cannot enter the index unlabelled
      - Plant a document containing injected instructions in a test index you own, and confirm your downstream controls neutralise it
      - Classify the content in one knowledge base by sensitivity, and route the most sensitive class through stricter retrieval and logging
