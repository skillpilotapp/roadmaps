  - id: prompt-injection-defence
    title: Prompt Injection Defence
    description: The signature failure of the field, and the one with no complete fix. Untrusted content reaching the context window is treated as instruction, and indirect injection through a retrieved document or tool output is the variant teams miss. Done when you can defend a system you own with layered controls and state honestly what your defences still do not stop.
    duration: 3-4 weeks
    skills:
      - name: Prompt Injection Defence
        level: advanced
        category: core
      - name: Indirect Injection via Content
        level: advanced
        category: core
      - name: Input & Output Segregation
        level: advanced
        category: core
      - name: Instruction Hierarchy Design
        level: advanced
        category: core
      - name: Content Provenance & Tainting
        level: advanced
        category: core
      - name: Output Validation
        level: advanced
        category: core
      - name: Defence in Depth
        level: advanced
        category: core
      - name: Residual Risk Documentation
        level: intermediate
        category: core
    projects:
      - Build a test corpus of injection-shaped inputs for a system you own, and track what fraction your current defences catch as a single baseline number
      - Layer three independent controls — input handling, privilege limits, output validation — and measure each one's contribution separately
      - Demonstrate indirect injection against your own retrieval pipeline by planting a document you control, then design the mitigation
      - Mark retrieved and tool-returned content as untrusted throughout your pipeline, so its provenance survives all the way to the model call
      - Treat model output as untrusted input to whatever consumes it, and add validation at that boundary rather than trusting the model
      - "Write the residual risk statement for your system: what your defences do not stop, and what compensating control covers it"
