faq:
  - question: What makes AI security different from regular application security?
    answer: "One property breaks the tools you already trust: the instruction and the data arrive in the same channel, so there is no prepared statement for a prompt. Input validation as you know it does not apply, because the payload is natural language and the parser is a model built to be helpful. Taking your existing appsec checklist and marking every control that stops working when the input is natural language is literally the first project in the roadmap."
  - question: How long does this AI security engineer roadmap take?
    answer: Budget 7-9 months at around 10 hours a week, spread across ten phases from threat landscape through incident response. Phase five, agent security, is where the threat model stops being theoretical because tools, credentials and autonomy turn a wrong answer into a wrong action.
  - question: Why does the roadmap cover prompt injection before agent security or RAG?
    answer: The ordering follows blast radius rather than novelty. Prompt injection comes first because it is the delivery mechanism for most of the other risks, and agent security is covered before RAG because an agent holding tools can act on what it was tricked into believing, which raises the stakes of an injection considerably.
  - question: What salary can an AI security engineer expect?
    answer: Using Security Engineer salary data as a proxy (the AI-specific title has too few reported salaries to publish on its own), entry-level sits around $140,357, the overall average is about $172,800, and senior roles average around $213,409 in the US market. These are Glassdoor estimates for the broader Security Engineer title, not a title-matched AI Security Engineer figure.
  - question: What do I need to know before starting this roadmap?
    answer: You should already have working knowledge of application security fundamentals such as authentication, authorization and input validation, plus practical experience calling an LLM API and reading its responses. Comfort reading and writing code in at least one language, ideally Python, and familiarity with cloud infrastructure and CI/CD round out the prerequisites.
  - question: Why is guardrail tuning treated as real engineering work in this roadmap?
    answer: "Guardrails run on every request in production, where latency and false positives are real costs, and a filter that blocks 2% of legitimate traffic gets switched off within a week. The roadmap treats tuning as the core skill: a guardrail is only done when it runs on live traffic with measured precision and recall, and you can state its latency cost per request."
