  - id: data-supply-chain
    title: Data Poisoning & Model Supply Chain
    description: Every third-party model and dataset is code you did not write, executing with your privileges. Serialised model formats can carry arbitrary execution, and a poisoned fine-tuning set installs behaviour no code review will find. Done when you can prove the provenance of every model artefact in your pipeline and have blocked one unsigned or unscanned artefact from reaching production.
