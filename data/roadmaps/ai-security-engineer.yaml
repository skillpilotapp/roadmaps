  - id: guardrails-runtime
    title: Guardrails & Runtime Defence
    description: The controls that run on every request in production, where latency and false positives are real costs. A filter that blocks 2% of legitimate traffic gets switched off within a week, so tuning is the engineering. Done when a guardrail you built runs on live traffic with measured precision and recall, and you can state its latency cost per request.
    duration: 3-4 weeks
    skills:
      - name: Guardrail Architecture
        level: advanced
        category: core
      - name: Input & Output Filtering
        level: advanced
        category: core
      - name: Classifier Tuning
        level: advanced
