  - id: model-inference-exposure
    title: Model & Inference Exposure
    description: What a served model leaks simply by answering. System prompts surface, training data can be memorised and recovered, and query access alone can approximate a proprietary model. Done when you have measured what one of your own deployed models discloses under sustained querying, and shipped a rate, logging or output control that reduces it — with the before-and-after figure.
