  - id: agent-security
    title: Agent Security & Excessive Agency
    description: An agent turns a wrong answer into a wrong action. Tools, credentials and autonomy convert a text failure into a database write or an outbound payment, which is why excessive agency climbed the 2026 list. Done when every tool your agent holds runs under least privilege, destructive actions require confirmation, and you have proved a revoked permission fails closed.
    duration: 4-5 weeks
    skills:
      - name: Least-Privilege Tool Design
        level: advanced
        category: core
      - name: Agent Permission Boundaries
        level: advanced
        category: core
      - name: Human-in-the-Loop Controls
        level: advanced
        category: core
      - name: Blast Radius Limitation
        level: advanced
        category: core
      - name: Sandboxing & Isolation
        level: advanced
        category: tool
      - name: Credential Scoping & Secrets
        level: advanced
        category: core
      - name: Multi-agent Trust
        level: advanced
        category: core
      - name: Action Audit Logging
        level: advanced
        category: core
    projects:
      - Enumerate every tool and credential an agent you own can reach, then cut each one to the narrowest scope that still works
      - Add explicit human confirmation for destructive or irreversible actions, and define in writing which actions qualify
      - Revoke one permission and verify the agent fails closed with a clear error rather than silently degrading or improvising
      - Run agent tool execution inside a sandbox with no ambient network or filesystem access, and document what broke when you removed it
      - Log every tool call an agent makes with its arguments and outcome, so an investigator can reconstruct a session without the agent's help
      - Threat-model an agent that reads from one system and writes to another, and identify where injected content could steer the write
