  - id: red-teaming
    title: Red Teaming Your Own AI Systems
    description: Adversarial evaluation as an authorised, repeatable engineering practice on systems you own. The output is not a list of clever tricks but a regression suite that fails a build. Done when an automated adversarial run executes in CI against a system you are authorised to test, and a change that weakens a defence breaks the pipeline rather than reaching production.
