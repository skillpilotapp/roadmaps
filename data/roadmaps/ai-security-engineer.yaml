phases:
  - id: ai-threat-landscape
    title: AI Threat Landscape
    description: "Classical appsec assumes code decides and data is inert. An LLM erases that line: the text it reads becomes the instructions it follows, so there is no parser to harden. Done when you have written a threat model for one AI system you own, mapped its risks onto the OWASP LLM Top 10 and MITRE ATLAS, and can name the controls that do not transfer from your existing appsec programme."
    duration: 3-4 weeks
    skills:
