faq:
  - question: How long does it take to become a cloud architect?
    answer: The full roadmap runs 8-11 months at around 10 hours a week, according to SkillPilot's editorial estimate. It is deliberately not a beginner path — it assumes two or more years of experience building or operating systems in production, plus working knowledge of Linux, networking and HTTP services.
  - question: How much does a cloud architect earn?
    answer: In the United States, Glassdoor's total pay estimates (based on 1,420 salaries submitted) place entry-level compensation around $159,276 at the 25th percentile, a mid-level average of $202,355, and senior compensation around $260,623 at the 75th percentile. These are total pay figures rather than base salary alone.
  - question: What does the Cloud Architect roadmap actually cover?
    answer: It moves from cloud fundamentals and service models through networking, storage and identity, into high availability and disaster recovery, cost trade-offs, and migration of systems you did not build. The later phases turn to architecture decision records and influence without formal authority, because most of the work is persuading teams you cannot mandate.
  - question: Do I need prior experience before starting this roadmap?
    answer: Yes. The roadmap expects two or more years building or operating production systems, working knowledge of Linux, networking and HTTP services, and comfort reading code in at least one language even if you no longer write it daily. It is built as an advanced-level path rather than an introduction to cloud computing.
  - question: Why does the roadmap spend so much time on disaster recovery and migration instead of just design patterns?
    answer: "Because most cloud architecture work is not greenfield: it is moving something that already runs, that nobody fully understands, and that cannot stop, and every system needs a disaster recovery plan that has actually been rehearsed rather than just documented. The roadmap has you execute a real failover and produce a migration plan with a cutover sequence and rollback point, rather than only reading about the seven migration strategies."
  - question: Is being technically right enough to succeed as a cloud architect?
    answer: No — the roadmap treats influence as a core skill because architects usually have no authority over the teams who must implement their designs, so a technically correct design that no team adopts has failed just as completely as a wrong one. The final phase is built around presenting trade-offs, facilitating reviews, and negotiating technical debt as risk and cost rather than as untidiness.
