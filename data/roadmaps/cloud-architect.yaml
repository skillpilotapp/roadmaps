  - id: identity-security-and-compliance
    title: Identity, Security and Compliance
    description: In cloud architecture identity is the perimeter, and most breaches are a permissions design failure rather than an exploit. The architect's job is the account topology and the trust boundaries, not the individual policy document. Done when you have designed a multi-account structure with guardrails that make the insecure action difficult by default rather than merely forbidden by policy.
    duration: 5-6 weeks
    skills:
      - name: IAM Policy and Role Design
        level: advanced
        category: core
      - name: Multi-account Topology
        level: advanced
        category: core
      - name: Least Privilege in Practice
        level: advanced
        category: core
      - name: Encryption and Key Management
        level: advanced
        category: core
      - name: Federation and SSO
        level: intermediate
        category: core
      - name: Compliance Controls
        level: intermediate
        category: core
      - name: Guardrails and Service Control Policies
        level: advanced
        category: core
      - name: Secrets Management
        level: intermediate
        category: core
    projects:
      - Design an account structure separating production, non-production and security tooling, with the service control policies that enforce the separation
      - Take an over-permissioned role, rebuild it from observed usage logs, and record what broke when you removed the extra permissions
      - Implement a key management design with rotation, and document who can decrypt what and who can grant that ability
      - Write the control mapping for one compliance requirement, naming the specific cloud control that satisfies each line
      - Federate a directory into cloud roles and prove that removing a user upstream revokes their access within a stated time
      - Audit a running account for public exposure and produce a prioritised remediation list ordered by blast radius
