  - id: high-availability-and-disaster-recovery
    title: High Availability and Disaster Recovery
    description: Every system has a disaster recovery plan; most have never run it, which means they have a document rather than a capability. The architect's contribution is turning vague availability ambitions into an RTO and RPO someone will fund. Done when you have executed a failover in a non-production environment and the measured recovery time is written next to the one you promised.
    duration: 4-5 weeks
    skills:
      - name: RTO and RPO Definition
        level: advanced
        category: core
      - name: Multi-AZ and Multi-region Patterns
        level: advanced
        category: core
      - name: DR Strategy Selection
        level: advanced
        category: core
      - name: Failover Design and Testing
        level: advanced
        category: core
      - name: Backup and Restore Verification
        level: intermediate
        category: core
      - name: Single Point of Failure Analysis
        level: advanced
        category: core
      - name: Graceful Degradation
        level: advanced
        category: core
    projects:
      - Write RTO and RPO for three tiers of one system and get a non-engineer to agree the numbers are worth their cost
      - Compare backup-and-restore, pilot light, warm standby and active-active for the same workload, pricing each and stating the recovery time each buys
      - Execute a region failover in a test environment and record the real recovery time against the target you published
      - Restore a production backup into a clean environment and time it — a backup that has never been restored is a hypothesis
      - Map single points of failure in an existing architecture, including the ones outside the cloud account such as DNS registrar and CI system
      - Design a degraded mode for one service that keeps its core function working when its main dependency is unavailable
