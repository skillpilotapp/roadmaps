phases:
  - id: cloud-fundamentals-and-service-models
    title: Cloud Fundamentals and Service Models
    description: "Before designing anything, learn what you are actually buying: a rented failure domain with someone else's operational assumptions baked in. IaaS, PaaS and serverless differ less in features than in which failures become your problem. Done when you can take one workload and state, for each of the three models, what you stop being responsible for and what new constraint you accept in exchange."
    duration: 3-4 weeks
    skills:
      - name: Shared Responsibility Model
        level: intermediate
        category: core
      - name: IaaS, PaaS and Serverless Trade-offs
        level: intermediate
        category: core
      - name: Regions, Zones and Failure Domains
        level: intermediate
        category: core
      - name: Cloud Service Taxonomy
        level: beginner
        category: core
      - name: Managed vs Self-hosted Analysis
        level: intermediate
        category: core
      - name: Provider Pricing Models
        level: intermediate
        category: core
      - name: Well-Architected Framework
        level: intermediate
        category: core
    projects:
      - Take one existing workload and write the same design three times — on VMs, on a managed platform, and serverless — with the operational burden each one removes and the constraint each one adds
      - Map a provider's region and availability zone topology for the two regions you would actually use, and record which of your dependencies are zonal, regional or global
      - Run a Well-Architected review against a system you did not design, and rank the findings by what would hurt first rather than by pillar
      - Write the shared responsibility boundary for a specific managed database, naming three failures that remain yours after the provider takes over
      - Price the same workload under on-demand, committed-use and spot pricing, and state the utilisation point where each becomes the cheapest
