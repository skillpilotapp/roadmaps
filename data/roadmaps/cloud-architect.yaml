  - id: migration-and-modernisation
    title: Migration and Modernisation
    description: "Most cloud architecture work is not greenfield: it is moving something that already runs, that nobody fully understands, and that cannot stop. The seven migration strategies matter less than knowing which applies to each application and why. Done when you have produced a migration plan for a real system with its cutover sequence, its rollback point and the strategy chosen per component."
    duration: 5-6 weeks
    skills:
      - name: Migration Strategy Selection
        level: advanced
        category: core
      - name: Application Discovery and Dependency Mapping
        level: advanced
        category: core
      - name: Strangler Fig Pattern
        level: advanced
        category: core
      - name: Data Migration and Dual Writes
        level: advanced
        category: core
      - name: Cutover and Rollback Planning
        level: advanced
        category: core
      - name: Legacy Constraint Analysis
        level: intermediate
        category: core
      - name: Modernisation Sequencing
        level: advanced
        category: core
    projects:
      - Take an application you did not write, map its real dependencies including the undocumented ones, and mark which block a move
      - Assign a migration strategy to each component of one system and write the reason each was not simply rehosted
      - Design a strangler fig migration for a monolith, naming the first slice to extract and how traffic gets routed during the transition
      - Write a cutover runbook with a rollback point at each step, and identify the step after which rollback stops being possible
      - Plan a data migration with a dual-write period, including how you verify both stores agree before switching reads
      - Estimate a migration in engineering weeks and record which assumption would hurt most if it were wrong
