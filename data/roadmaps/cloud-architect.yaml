  - id: cost-and-performance-tradeoffs
    title: Cost and Performance Trade-offs
    description: An architecture nobody can afford is a failed architecture, and cost is the constraint most designs discover only after the first full month of billing. This phase turns cost from a finance report into a design input. Done when you can present two designs for the same requirement with their monthly cost, and recommend one on grounds a finance stakeholder finds legible.
    duration: 3-4 weeks
    skills:
      - name: Cost Modelling Before Build
        level: advanced
        category: core
      - name: Commitment and Spot Purchasing
        level: intermediate
        category: core
      - name: Rightsizing and Autoscaling
        level: intermediate
        category: core
      - name: Data Transfer Cost Analysis
        level: advanced
        category: core
      - name: Performance Benchmarking
        level: intermediate
        category: core
      - name: Cost Attribution and Tagging
        level: intermediate
        category: core
      - name: Build vs Buy Analysis
        level: advanced
        category: core
    projects:
      - Model the monthly cost of a design before building it, then compare the estimate against the first real bill and explain the gap
      - Find the data transfer charges in an existing bill and trace each one to the architectural decision that created it
      - Benchmark two instance families on the same workload and calculate cost per unit of work rather than cost per hour
      - Design a tagging scheme that lets every line of a bill be attributed to a team, and test it against a month of real spend
      - Write a build-versus-buy analysis for one managed service, costing the engineering time the self-hosted option consumes
