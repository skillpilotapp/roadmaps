  - id: architecture-decision-records
    title: Architecture Decision Records
    description: An architecture is the set of decisions that were expensive to change, and most of them get made in conversations nobody wrote down. Six months later the team relitigates a choice because the constraint that forced it is forgotten. Done when a decision you recorded is read by someone who was not in the room and they can explain why the rejected option was rejected.
    duration: 2-3 weeks
    skills:
      - name: Writing Decision Records
        level: intermediate
        category: core
      - name: Trade-off Articulation
        level: advanced
        category: core
      - name: Documenting Rejected Options
        level: advanced
        category: core
      - name: Architecture Diagramming
        level: intermediate
        category: core
      - name: Fitness Functions
        level: advanced
        category: core
      - name: Technical Writing for Architects
        level: intermediate
        category: core
    projects:
      - Write three decision records for choices already made in a system you know, reconstructing the constraints that applied at the time
      - Document a decision including the option you rejected, and have a colleague who disagreed review whether you represented their case fairly
      - Produce a C4 diagram set for one system and test it by asking a new joiner to trace a request through it unaided
      - Define one fitness function that fails a build when an architectural constraint is violated, and watch it catch a real violation
      - Revisit a decision record after a change of circumstances and write the follow-up that supersedes it rather than editing the original
