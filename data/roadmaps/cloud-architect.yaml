  - id: influence-and-stakeholder-architecture
    title: Influence and Stakeholder Architecture
    description: The architect usually has no authority over the teams who must implement the design, so the work is persuasion backed by evidence. A technically correct design that no team adopts has failed as completely as a wrong one. Done when a team implements a design you proposed but could not mandate, and you can name the argument that changed their mind.
    duration: 3-4 weeks
    skills:
      - name: Influence Without Authority
        level: advanced
        category: core
      - name: Stakeholder Communication
        level: advanced
        category: core
      - name: Presenting Trade-offs to Executives
        level: advanced
        category: core
      - name: Architecture Review Facilitation
        level: advanced
        category: core
      - name: Technical Debt Negotiation
        level: advanced
        category: core
      - name: Mentoring Engineers
        level: intermediate
        category: core
      - name: Handling Disagreement
        level: advanced
        category: core
    projects:
      - Present one architecture two ways — to engineers and to a budget holder — and note which objections only appeared in the second version
      - Facilitate a review where you are not the author, and leave with the author still committed to their design or genuinely convinced to change it
      - Turn one piece of technical debt into a funded work item by expressing it as risk and cost rather than as untidiness
      - Propose a design to a team you cannot direct, and record what actually persuaded them or why they declined
      - Write the one-page version of a complex design for someone who will spend ninety seconds on it
