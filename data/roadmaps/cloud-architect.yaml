  - id: compute-and-networking-design
    title: Compute and Networking Design
    description: Networking is where cloud designs fail quietly and expensively. Addressing decisions made in week one constrain the architecture for years, because renumbering a live VPC is close to impossible. Done when you have designed an address plan for three environments that can absorb a corporate VPN and a second region without overlapping, and can defend every subnet boundary in it.
    duration: 4-6 weeks
    skills:
      - name: VPC and Subnet Design
        level: advanced
        category: core
      - name: IP Address Planning
        level: advanced
        category: core
      - name: Routing and Egress Control
        level: advanced
        category: core
      - name: Load Balancing Strategy
        level: intermediate
        category: core
      - name: Compute Sizing and Families
        level: intermediate
        category: core
      - name: Container and Serverless Placement
        level: intermediate
        category: core
      - name: Hybrid Connectivity
        level: advanced
        category: core
      - name: DNS Architecture
        level: intermediate
        category: core
    projects:
      - Produce an IP address plan for dev, staging and production that leaves room for a second region and a corporate VPN, and justify every CIDR boundary
      - Build a three-tier network with public, private and data subnets, then prove the data tier cannot reach the internet by testing it rather than by reading the route table
      - Compare a layer 7 and a layer 4 load balancer for one real workload, measuring the latency difference rather than quoting the documentation
      - Design egress for a private subnet three ways — NAT gateway, VPC endpoints, proxy — and price each at your actual traffic volume
      - Take a monolith and write the placement decision for each component across VMs, containers and functions, with the reason each one landed where it did
      - Document a hybrid connectivity design for an office network, including what breaks during a failover and who notices first
