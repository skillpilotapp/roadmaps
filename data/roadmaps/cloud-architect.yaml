  - id: multi-cloud-and-hybrid
    title: Multi-Cloud and Hybrid
    description: Multi-cloud is demanded more often than it is justified, and the architect who cannot argue against it when it is wrong will build an expensive lowest-common-denominator platform. The honest position is that it solves specific problems — regulatory, acquisition, genuine vendor risk — at a real operational cost. Done when you can write the case for and against multi-cloud for one organisation and recommend a position you would defend to its board.
    duration: 3-4 weeks
    skills:
      - name: Multi-cloud Justification Analysis
        level: advanced
        category: core
      - name: Portability vs Managed Service Trade-off
        level: advanced
        category: core
      - name: Hybrid Architecture Patterns
        level: advanced
        category: core
      - name: Cross-cloud Networking
        level: advanced
        category: core
      - name: Vendor Lock-in Assessment
        level: advanced
        category: core
      - name: Data Residency and Sovereignty
        level: intermediate
        category: core
    projects:
      - Write both sides of a multi-cloud proposal for one organisation, then state your recommendation and the evidence that decided it
      - Cost the operational overhead of running one workload on two providers, including the training and on-call burden
      - Quantify lock-in for a specific managed service as the engineering weeks needed to leave it, not as an adjective
      - Design a hybrid architecture with a genuine on-premises constraint such as a device, a licence or a data residency rule
      - Map data residency requirements to specific regions and record what those constraints forbid architecturally
