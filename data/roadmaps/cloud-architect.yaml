  - id: storage-and-data-architecture
    title: Storage and Data Architecture
    description: "Choosing a data store is the least reversible decision an architect makes: compute can be rewritten in a sprint, but a data model that no longer fits takes a migration project. Done when you can justify a store choice for a real workload from its access pattern, consistency need and growth curve, and say what it would cost to move off it later."
    duration: 4-5 weeks
    skills:
      - name: Object, Block and File Storage
        level: intermediate
        category: core
      - name: Relational vs Non-relational Selection
        level: advanced
        category: core
      - name: Consistency and Replication Models
        level: advanced
        category: core
      - name: Access Pattern Modelling
        level: advanced
        category: core
      - name: Caching Strategy
        level: intermediate
        category: core
      - name: Storage Tiering and Lifecycle
        level: intermediate
        category: core
      - name: Data Migration Paths
        level: advanced
        category: core
    projects:
      - Write the access patterns for one application first, then pick its data store from those patterns, and record which candidate you rejected and why
      - Design an S3 lifecycle policy for a real retention requirement and calculate the annual saving against storing everything in the hot tier
      - Add a cache to a read-heavy workload, measure the hit rate under realistic traffic, and document the staleness the design now tolerates
      - Model the same dataset relationally and in a document store, and write the query that is trivial in one and painful in the other
      - Estimate the cost and downtime of migrating one production dataset to a different engine, including the dual-write period
