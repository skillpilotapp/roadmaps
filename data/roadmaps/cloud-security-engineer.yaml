  - id: threat-modelling
    title: Threat Modelling Cloud Architectures
    description: A defensive discipline that borrows an attacker's perspective. You model a system, ask what can go wrong, and decide what to do about it — before the design is concrete. Done when you have threat modelled a real architecture, ranked the threats, and shipped a mitigation for the highest-ranked one that the design review would otherwise have missed.
    duration: 3-4 weeks
    skills:
      - name: Threat Modelling Methodology
        level: advanced
