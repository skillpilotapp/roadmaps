  - id: identity-access
    title: Identity & Access Management
    description: The spine of the whole path. In cloud, identity is the perimeter — the network boundary you inherited from the datacentre no longer decides who reaches what. Done when you have replaced a permissive policy on a real workload with a least-privilege one derived from observed access, and proved the old one granted more than the workload ever used.
    duration: 5-6 weeks
    skills:
      - name: IAM Policy Authoring
        level: advanced
        category: core
      - name: Least Privilege Derivation
        level: advanced
        category: core
      - name: Roles & Temporary Credentials
        level: advanced
        category: core
      - name: Federation & SSO
