  - id: network-security
    title: Network Security in the Cloud
    description: The network is no longer the perimeter, but it is still a control. Segmentation, private connectivity and egress restriction limit what a compromised workload can reach next. Done when you have segmented a real environment so one workload cannot reach a service it has no reason to call, and demonstrated the block with a connection test rather than a diagram.
    duration: 4-5 weeks
    skills:
      - name: VPC & Subnet Design
        level: advanced
        category: core
      - name: Security Groups & NACLs
        level: intermediate
        category: core
      - name: Network Segmentation
        level: advanced
        category: core
      - name: Egress Control
        level: advanced
        category: core
      - name: Private Endpoints
        level: advanced
        category: core
      - name: TLS & Certificate Management
        level: intermediate
        category: core
      - name: Flow Log Analysis
        level: advanced
        category: core
      - name: DNS Security
        level: intermediate
        category: core
    projects:
      - Segment an environment so one workload cannot reach a service it has no reason to call, and prove the block with a connection test
      - Restrict egress on a workload that previously had open internet access, then find every dependency the restriction broke and allow only those
      - Replace public service access with private endpoints so traffic never traverses the internet, and verify with flow logs that it no longer does
      - Enable flow logs and use them to find one connection nobody could justify, then remove the path that allowed it
      - Audit security groups for rules allowing 0.0.0.0/0, and for each one either close it or write down why it must stay
      - Enforce TLS on a service using a policy condition rather than trusting clients to opt in, and confirm plaintext requests are rejected
