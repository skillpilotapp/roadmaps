faq:
  - question: Why does identity get one of the longest phases in this roadmap?
    answer: In the cloud, identity is the perimeter — there is no network edge to stand behind, and almost every serious cloud breach reduces to a credential or a role that could do more than it needed to. A misconfigured IAM policy outranks an unpatched host, which is why Identity & Access Management runs 5-6 weeks, tied with Workload, Container & Supply Chain Security as the longest phases in the path.
  - question: How long does the Cloud Security Engineer roadmap take?
    answer: The full path is estimated at 9-12 months at 10 hours a week. Phase five alone spans containers and supply chain security because the editorial view treats that as one attack surface rather than two, which is part of why the timeline runs long.
  - question: Why does detection come after the preventive phases instead of first?
    answer: Detection & Security Monitoring is deliberately placed after identity, network, data and workload security are covered. Alerts on a system you have not hardened produce a queue nobody works, and that unworked queue becomes the control instead of an actual fix.
  - question: How much does a Cloud Security Engineer earn?
    answer: In the United States, entry-level pay is around $134,792 (Glassdoor 25th percentile), the overall average is about $169,173, and senior Cloud Security Engineers average roughly $180,921. All three figures come from Glassdoor's Cloud Security Engineer salary data retrieved in August 2026.
  - question: What prior knowledge do I need before starting this roadmap?
    answer: You need working knowledge of at least one public cloud covering compute, storage and networking, comfort with Linux, the command line and at least one scripting language, plus a basic understanding of TCP/IP, DNS and TLS. The roadmap builds on those fundamentals rather than teaching them from scratch.
  - question: What does the Compliance & Governance as Code phase actually involve?
    answer: "It treats compliance as engineering rather than a questionnaire: expressing a written control as executable policy, blocking a non-compliant change with it, and producing audit evidence automatically instead of by screenshot. It covers policy as code, tools like Open Policy Agent and Rego, IaC scanning, drift detection, and mapping compliance frameworks to the technical checks that actually enforce them."
