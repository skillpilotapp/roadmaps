phases:
  - id: shared-responsibility
    title: Cloud Security Fundamentals
    description: "Every cloud security mistake starts with a wrong answer to one question: who secures this? The line moves between IaaS, PaaS and SaaS, and it moves per service. Done when you can take one real workload, draw the responsibility boundary for every service it uses, and name the controls that fall to you rather than the provider."
    duration: 3-4 weeks
    skills:
      - name: Shared Responsibility Model
        level: intermediate
        category: core
      - name: Cloud Threat Landscape
        level: intermediate
        category: core
      - name: Security Design Principles
        level: intermediate
        category: core
      - name: Defence in Depth
        level: intermediate
        category: core
      - name: Blast Radius Reasoning
        level: advanced
