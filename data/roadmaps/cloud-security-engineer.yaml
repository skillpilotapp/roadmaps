  - id: data-protection
    title: Data Protection & Encryption
    description: Encryption is easy to enable and easy to get wrong, because the interesting question is never the cipher — it is who can use the key. Done when you have encrypted a real dataset with a customer-managed key, written a key policy that denies access to an identity that can read the data store, and shown the denial in practice.
    duration: 4-5 weeks
    skills:
      - name: Key Management Services
        level: advanced
        category: core
      - name: Key Policies & Grants
