  - id: backup-and-restore-verification
    title: Backup and Restore Verification
    description: A backup that has never been restored is a hypothesis, and the moment you discover it was wrong is the worst possible moment. This phase treats the restore, not the backup, as the deliverable. Done when a restore runs automatically on a schedule, its duration is recorded as a metric, and someone is alerted when a restore fails rather than when a backup does.
    duration: 3-4 weeks
    skills:
      - name: Physical and Logical Backups
        level: intermediate
        category: core
      - name: Point-in-Time Recovery
        level: advanced
        category: core
      - name: Automated Restore Testing
        level: advanced
        category: core
      - name: Backup Retention Design
        level: intermediate
        category: core
      - name: Restore Time Measurement
        level: advanced
        category: core
      - name: Backup Encryption and Access
        level: intermediate
        category: core
    projects:
      - Restore a production-sized backup into a clean environment and publish the real restore time next to the promised one
      - Perform a point-in-time recovery to a timestamp thirty seconds before a deliberate destructive statement
      - Automate a nightly restore into a throwaway environment, with an alert that fires on restore failure rather than backup failure
      - Design a retention policy against a real regulatory or business requirement and cost it at your current data growth
      - Corrupt a backup file on purpose and confirm your verification step detects it before you need the backup
