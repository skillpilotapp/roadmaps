  - id: data-integrity-and-corruption-detection
    title: Data Integrity and Corruption Detection
    description: "Corruption is the failure mode that does not page anyone: it spreads into backups while every dashboard stays green, and gets discovered months later by a customer. Done when a checksum or consistency check runs on a schedule against real data, and you have seen it detect a fault you introduced deliberately rather than trusting that it would."
    duration: 3-4 weeks
    skills:
      - name: Checksums and Page Verification
        level: advanced
        category: core
      - name: Logical Consistency Checking
        level: advanced
        category: core
      - name: Constraint and Foreign Key Design
        level: intermediate
        category: core
      - name: Replica Divergence Detection
        level: advanced
        category: core
      - name: Silent Corruption Response
        level: advanced
        category: core
      - name: Audit Trails
        level: intermediate
        category: core
    projects:
      - Enable page checksums, corrupt a page deliberately, and confirm the database detects it rather than serving the bad data
      - Compare a primary and replica row by row and find the divergence you introduced on purpose
      - Write a scheduled logical consistency check for an invariant your schema cannot express as a constraint
      - Trace how a corrupted page would propagate into your backups, and state how far back you would need to go
      - Add constraints to a table that permits invalid states today, and record how many existing rows violate them
