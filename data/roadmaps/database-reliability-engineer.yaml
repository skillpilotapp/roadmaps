faq:
  - question: What does the Database Reliability Engineer roadmap actually cover?
    answer: It covers replication and consistency, restores you have actually verified, zero-downtime schema migrations, corruption detection, running databases on Kubernetes, and treating RTO and RPO as a contract. The roadmap treats the database as a production system with an owner rather than as a dependency someone else maintains, across ten phases from storage internals through fleet-scale reliability.
  - question: How long does it take to complete this roadmap?
    answer: SkillPilot's editorial estimate is 8-11 months at 10 hours a week, split across ten phases ranging from 3-4 weeks to 4-6 weeks each. The longest phase is Replication and Consistency; the shortest phases, at 3-4 weeks, cover backup and restore verification, schema migrations, capacity management, and corruption detection.
  - question: How much does a Database Reliability Engineer earn?
    answer: In the United States, Glassdoor's total pay estimates put entry-level pay at $129,281 (25th percentile), the mid-level average at $156,093, and senior pay at $190,972 (75th percentile), based on 24 salaries submitted and retrieved 2026-08-10. These are total pay figures, not base salary alone.
  - question: What do I need to know before starting this roadmap?
    answer: You need confident SQL — including joins, indexes and reading a query plan — a working knowledge of Linux, filesystems and networking, and some production experience operating a service in any role. It is labelled an advanced roadmap, so it assumes you are not learning to code or use a terminal for the first time.
  - question: Why does the roadmap treat backup verification separately from backups themselves?
    answer: Because a backup that has never been restored is only a hypothesis, and the moment you discover it was wrong is the worst possible moment. The Backup and Restore Verification phase treats the restore, not the backup, as the deliverable — done when a restore runs automatically on a schedule, its duration is recorded as a metric, and someone is alerted when a restore fails rather than when a backup does.
  - question: Does this roadmap teach running databases on Kubernetes?
    answer: Yes — Databases on Kubernetes is one of the ten phases, and the roadmap is candid that running stateful workloads on an orchestrator designed to reschedule things freely is the hardest operational problem it covers, and sometimes the honest answer is not to. It is done when you have run a database on Kubernetes through a node failure and a rolling upgrade without data loss, and can argue in writing when a managed service would have been the better call.
