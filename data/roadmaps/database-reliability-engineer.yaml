  - id: capacity-and-connection-management
    title: Capacity and Connection Management
    description: Databases fail on connections and IOPS long before they run out of CPU, and the failure mode is a thundering herd of application retries making it worse. Done when you can state your database's maximum sustainable connection count and write throughput from measurement rather than from the vendor's datasheet, and have an alert that fires before either is reached.
    duration: 3-4 weeks
    skills:
      - name: Connection Pool Sizing
        level: advanced
        category: core
      - name: IOPS and Throughput Planning
        level: advanced
        category: core
      - name: Growth Forecasting
        level: intermediate
        category: core
      - name: Load Testing Databases
        level: advanced
        category: core
      - name: Retry and Backoff Design
        level: advanced
        category: core
      - name: Resource Saturation Alerting
        level: intermediate
        category: core
    projects:
      - Load test until the database degrades and record which resource saturated first — it is rarely the one you expected
      - Size a connection pool from measurement, then prove the number by testing above and below it
      - Forecast storage and IOPS growth twelve months out from real data, and state which assumption breaks the forecast
      - Reproduce a retry storm and fix it with jittered backoff, measuring recovery time before and after
      - Write saturation alerts that fire with enough lead time to act, and verify the lead time by triggering one
