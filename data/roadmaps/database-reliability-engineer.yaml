  - id: performance-and-query-optimisation
    title: Performance and Query Optimisation
    description: "Most database performance work is not tuning the server: it is finding the three queries responsible for most of the load and fixing them. The skill is measurement discipline, because intuition about what is slow is reliably wrong. Done when you have found the top queries by total time rather than by worst case, and made a measured improvement to the one that mattered."
    duration: 4-5 weeks
    skills:
      - name: Query Plan Analysis
        level: advanced
        category: core
      - name: Index Design and Maintenance
        level: advanced
        category: core
      - name: Workload Profiling
