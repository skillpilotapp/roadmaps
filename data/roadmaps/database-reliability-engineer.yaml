phases:
  - id: database-fundamentals-for-operators
    title: Database Fundamentals for Operators
    description: "Operating a database means understanding what happens below the query: how pages reach disk, why the write-ahead log exists, and what a transaction actually guarantees. Without that model every incident is a mystery. Done when you can trace a single INSERT from client connection through WAL to durable storage, and explain which step is lost if the process is killed at each point."
    duration: 4-5 weeks
    skills:
      - name: Storage Engines and Page Layout
        level: intermediate
        category: core
      - name: Write-Ahead Logging
        level: advanced
        category: core
      - name: ACID and Isolation Levels
        level: advanced
        category: core
      - name: MVCC and Vacuum
        level: advanced
        category: core
      - name: Index Internals
        level: advanced
        category: core
      - name: Query Planning
        level: intermediate
        category: core
      - name: Connection Handling
        level: intermediate
        category: core
    projects:
      - Trace one INSERT from connection to durable storage and record what is lost if the process dies at each stage
      - Reproduce a phantom read and a non-repeatable read on purpose, then fix each by changing only the isolation level
      - Force a table bloat scenario, observe what vacuum reclaims and what it does not, and record the disk numbers
      - Take a slow query, read its plan, and make it fast by changing the index rather than the SQL
      - Exhaust a connection pool deliberately and record what the application error looks like from the user's side
