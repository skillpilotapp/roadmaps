  - id: databases-on-kubernetes
    title: Databases on Kubernetes
    description: Running stateful workloads on an orchestrator designed to reschedule things freely is the hardest operational problem in this roadmap, and the honest answer is sometimes not to. Done when you have run a database on Kubernetes through a node failure and a rolling upgrade without data loss, and can argue in writing when a managed service would have been the better call.
    duration: 4-5 weeks
    skills:
      - name: StatefulSets and Persistent Volumes
        level: advanced
        category: core
      - name: Database Operators
        level: advanced
        category: core
      - name: Storage Classes and IOPS on Kubernetes
        level: advanced
        category: core
      - name: Pod Disruption Budgets
        level: intermediate
        category: core
      - name: Backup in a Kubernetes Context
        level: advanced
        category: core
      - name: Managed vs Self-hosted Decision
        level: advanced
        category: core
    projects:
      - Deploy a replicated database with an operator, then delete the primary pod and record what the operator did and how long it took
      - Drain a node running a database pod and measure the disruption from the client's point of view
      - Configure pod disruption budgets that survive a cluster upgrade, and verify by performing one
      - Benchmark the same database on a persistent volume and on local storage, and record the durability trade-off
      - Write the decision record for self-hosting versus a managed service, costed in engineering hours per month
