  - id: schema-migrations-without-downtime
    title: Schema Migrations Without Downtime
    description: A schema change is a deployment that can lock a table and take the site down, and the naive version of the migration is usually the dangerous one. Expand-and-contract turns one risky change into several safe ones. Done when you have shipped a column rename across a running system with no downtime, using separate deployments to add, backfill, switch and remove.
    duration: 3-4 weeks
    skills:
      - name: Expand and Contract Pattern
        level: advanced
        category: core
      - name: Online Schema Change Tools
        level: advanced
        category: core
      - name: Backfill Strategy
        level: advanced
        category: core
