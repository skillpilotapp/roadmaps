  - id: replication-and-consistency
    title: Replication and Consistency
    description: "Replication is how databases survive hardware failure and also how they silently serve stale data. The distinction between synchronous and asynchronous is not a configuration detail: it decides whether a failover can lose committed transactions. Done when you have measured replication lag under write load and can state exactly how much data your topology loses if the primary dies right now."
    duration: 4-6 weeks
    skills:
      - name: Synchronous vs Asynchronous Replication
        level: advanced
        category: core
      - name: Streaming and Logical Replication
        level: advanced
        category: core
      - name: Replication Lag Measurement
        level: advanced
        category: core
      - name: Read Replica Routing
        level: intermediate
        category: core
      - name: Quorum and Consensus
        level: advanced
        category: core
      - name: Split-brain Prevention
        level: advanced
        category: core
      - name: Cross-region Replication
        level: advanced
        category: core
    projects:
      - Build a primary with two replicas, then measure lag under sustained write load rather than at idle
      - Calculate your topology's real data loss window on primary failure, and verify it by killing the primary mid-write
      - Route reads to a replica and find a user-visible bug caused by reading your own stale write
      - Set up logical replication between two different major versions and record which DDL changes it refuses to carry
      - Induce a network partition between primary and replica and document what each side believes about the other
      - Compare synchronous replication's latency cost against its durability gain, with numbers from your own hardware
