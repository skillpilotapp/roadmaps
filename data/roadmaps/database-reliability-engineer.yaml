  - id: high-availability-and-failover
    title: High Availability and Failover
    description: Automatic failover is a promise that the system will make a correct decision during the worst five minutes of the quarter, and untested automation usually makes it worse. Done when you have triggered a failover in anger — killing the primary without warning the tooling — and the cluster converged on a single writer with the data loss you predicted, not more.
    duration: 4-5 weeks
    skills:
      - name: Failover Automation
        level: advanced
        category: core
      - name: Leader Election and Fencing
        level: advanced
        category: core
      - name: Connection Pooling and Proxies
        level: advanced
        category: core
      - name: Health Checking Design
        level: advanced
        category: core
      - name: Switchover vs Failover
        level: intermediate
        category: core
      - name: Client Reconnection Behaviour
        level: advanced
        category: core
      - name: Failover Testing in Production
        level: advanced
        category: core
    projects:
      - Kill a primary without warning the failover tooling and record the time to a single healthy writer
      - Configure fencing and prove that the demoted primary cannot accept a write after being isolated
      - Put a connection pooler in front of a cluster and measure how many client errors a failover produces with and without it
      - Write a health check that distinguishes a slow database from a dead one, and test it against both conditions
      - Perform a planned switchover during working hours with zero failed writes, and document the sequence that made it safe
      - Test what your application does when the database is read-only for ninety seconds
