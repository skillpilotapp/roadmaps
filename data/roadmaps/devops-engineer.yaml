  - id: infrastructure
    title: Cloud Infrastructure & Platforms
    description: Build cloud infrastructure by hand before automating it. Done when you can explain why a resource in a private subnet cannot reach the internet, fix it without a guide, and draw your VPC from memory. Pick one provider and go deep — three shallow is worth less than one deep, and the second takes a fortnight once the concepts hold.
    duration: 2-3 months
    skills:
      - name: Cloud Provider Fundamentals
        level: intermediate
        category: core
      - name: Virtual Machines & Compute
        level: intermediate
        category: core
      - name: VPC & Subnetting
        level: advanced
