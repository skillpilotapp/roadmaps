  - id: cost-resilience
    title: Cost Governance & Resilience
    description: "The two failure modes nobody notices until the invoice or the outage: spend that grows quietly, and a recovery procedure that was never actually tested. Done when you can show a real rightsizing saving with a number attached, and you have restored a service from backup into a clean environment and timed it — not assumed it would work."
    duration: 3-4 weeks
    skills:
      - name: Cost Optimisation (FinOps)
        level: advanced
