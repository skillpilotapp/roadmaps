    title: Containerization & Orchestration
    description: Docker and Kubernetes in depth. Done when you can explain why your image is 1.2GB and get it under 200MB, and diagnose a CrashLoopBackOff from logs and events rather than by deleting the pod and hoping. The manifests are the surface — the pages are about networking, scheduling and resource contention.
