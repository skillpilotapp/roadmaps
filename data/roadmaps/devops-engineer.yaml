  - id: monitoring
    title: Monitoring & Site Reliability
    description: Make the system you built observable. Done when you can answer "was it healthy last Tuesday at 3pm?" with data rather than opinion, and your alerts fire on user-visible symptoms rather than on CPU. Cause-based alerting is the direct route to fatigue, and fatigue is how the real page gets missed.
