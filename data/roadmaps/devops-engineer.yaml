phases:
  - id: foundation
    title: Foundation & Linux Mastery
    description: "Linux administration, the shell, and Git. Done when you can rebuild your server from your own notes without searching, and read someone else's bash script and predict what it does before running it. Kubernetes troubleshooting is Linux troubleshooting: skip this and every later phase becomes guesswork."
    duration: 1-2 months
    skills:
      - name: Linux Administration
        level: intermediate
        category: core
      - name: Filesystem & Permissions
        level: intermediate
        category: core
      - name: Process & Service Management
        level: intermediate
        category: core
