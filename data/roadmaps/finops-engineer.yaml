  - id: forecasting-budgeting
    title: Forecasting & Budgeting
    description: Moving from explaining last month to predicting next quarter. This phase covers forecast models, budget thresholds and anomaly detection that fires before the invoice does. Done when you have published a forecast, tracked it against actuals for a full month, and stated your variance as a percentage. A forecast nobody scored is a guess with formatting.
    duration: 2-3 weeks
    skills:
      - name: Cost Forecasting
        level: advanced
