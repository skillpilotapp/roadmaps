  - id: rate-optimisation
    title: Rate Optimisation
    description: Paying less for the same resource. Commitments, reservations, spot capacity and negotiated rates all lower the price per unit without touching architecture. Done when you have modelled a commitment purchase, stated the break-even point and the risk if usage drops, and can report a current coverage and utilisation figure. A commitment bought on a peak month bills you for years of a shape you no longer have.
    duration: 3-4 weeks
    skills:
      - name: Reserved Instances
        level: advanced
        category: core
      - name: Savings Plans & Commitments
        level: advanced
        category: core
      - name: Spot & Preemptible Capacity
        level: advanced
        category: core
      - name: Commitment Coverage & Utilisation
        level: advanced
        category: core
      - name: Break-even Modelling
        level: advanced
        category: core
      - name: Effective Savings Rate
        level: intermediate
        category: core
      - name: Vendor Negotiation Support
        level: intermediate
        category: core
      - name: Commitment Risk Management
        level: advanced
        category: core
    projects:
      - Model a one-year and a three-year commitment for one workload, showing break-even month and the loss if usage falls 30%
      - Report current commitment coverage and utilisation as two separate numbers, and explain why optimising only one of them is a trap
      - Move a fault-tolerant batch workload onto spot capacity and measure both the saving and the interruption rate you actually saw
      - Calculate your effective savings rate across a whole account and compare it against the headline discount the provider advertises
      - Write the commitment purchase recommendation you would sign, including the usage forecast it depends on and what invalidates it
      - Audit existing commitments for waste — find the ones covering capacity that no longer runs, and quantify the monthly loss
