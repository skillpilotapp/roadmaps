  - id: usage-optimisation
    title: Usage Optimisation
    description: Rate optimisation lowers the price; this lowers the quantity. Rightsizing, scheduling, autoscaling and deleting things nobody owns. Done when you have cut a real workload's spend by a measurable percentage without degrading its service level, and can show the before-and-after utilisation to prove it. Savings that arrive as a production incident are not savings, they are a rollback.
    duration: 3-4 weeks
    skills:
      - name: Rightsizing
        level: advanced
        category: core
      - name: Idle Resource Detection
        level: intermediate
        category: core
      - name: Scheduled Shutdown
        level: intermediate
        category: core
      - name: Autoscaling for Cost
        level: advanced
        category: core
      - name: Storage Tiering & Lifecycle
        level: intermediate
        category: core
      - name: Data Transfer & Egress Costs
        level: advanced
        category: core
      - name: Utilisation Analysis
        level: advanced
        category: core
      - name: Safe Change Management
        level: intermediate
        category: core
    projects:
      - Cut one workload's monthly spend by at least 20% without changing its service level, and publish before-and-after utilisation
      - Build an idle resource report — unattached disks, idle load balancers, forgotten environments — and drive it to zero with named owners
      - Implement a scheduled shutdown for non-production environments and measure the actual saving, not the theoretical one
      - Rightsize a fleet from observed utilisation percentiles rather than averages, and document what headroom you deliberately kept
      - Apply a storage lifecycle policy that tiers or expires old objects, then verify nothing that mattered was moved
      - Trace a surprising data transfer charge to the architecture decision that caused it, and propose the fix with its cost
