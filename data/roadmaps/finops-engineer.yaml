  - id: unit-economics
    title: Unit Economics
    description: Total spend rising is not by itself bad news. This phase connects cost to the thing the business sells, so a growing bill can be read as healthy or alarming rather than just large. Done when you can state a cost per transaction, per customer or per request for one real service, and show its trend over three months alongside the volume that drove it.
