  - id: finops-culture
    title: FinOps Culture & Accountability
    description: The technical work stalls here more often than anywhere else. Cost data changes nothing until an engineer or product manager acts on it without being chased. Done when a team you do not manage changed a decision because of a number you published, and did it without you in the room. Reports people ignore are not a reporting problem — they arrive at the wrong moment, to the wrong person, in the wrong unit.
