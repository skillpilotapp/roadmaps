  - id: cost-visibility-allocation
    title: Cost Visibility & Allocation
    description: Nobody optimises a cost they do not believe is theirs. This phase turns an undifferentiated bill into per-team numbers using accounts, tags and labels. Done when you can attribute at least 90% of last month's spend to a named owner and defend the split for the shared 10%. Untagged spend is not a tagging problem — it is an accountability gap with a technical symptom.
    duration: 3-4 weeks
    skills:
      - name: Tagging Strategy
        level: intermediate
        category: core
      - name: Account & Project Hierarchy
        level: intermediate
        category: core
      - name: Showback Reporting
        level: intermediate
        category: core
      - name: Chargeback Models
        level: advanced
        category: core
      - name: Shared Cost Allocation
        level: advanced
        category: core
      - name: Tag Coverage Measurement
        level: intermediate
        category: core
      - name: Cost Dashboards
        level: intermediate
        category: tool
      - name: Data Enrichment & Joins
        level: intermediate
        category: tool
    projects:
      - Build a showback report that attributes at least 90% of last month's bill to a named team, and list what remains unattributed
      - Design a tagging schema with required keys and allowed values, then measure current coverage against it as a single percentage
      - Pick one shared cost — a NAT gateway, a logging pipeline, a shared cluster — and implement a defensible split, then present it to the teams being charged
      - Enrich raw billing data with an ownership lookup table so every line item resolves to a team without anyone reading a tag by hand
      - Write the chargeback proposal you would take to finance, including what happens when a team disputes its number
      - Track tag coverage weekly for a month and show whether the trend moved after you told people about it
