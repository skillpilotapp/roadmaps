    title: Cloud Billing Fundamentals
    description: "Before you can reduce a bill you have to read one. This phase is the mechanics: what a line item is, why on-demand, amortised and blended costs disagree, and where the invoice and the console diverge. Done when you can take last month's raw billing export and reconcile it to the invoice total to within a rounding error, and explain every discrepancy you found."
