  - id: kubernetes-cost
    title: Kubernetes & Container Cost
    description: The hard case. A cluster arrives as one bill for nodes, while the things you must charge for are pods that share them. Done when you can attribute a shared cluster's cost down to namespace or workload level, including idle node capacity, and defend how you split it. Container cost is where most FinOps practices stop being credible, because the naive answer — divide by pod count — is wrong in an obvious way.
    duration: 4-5 weeks
    skills:
      - name: Container Cost Allocation
        level: advanced
        category: core
      - name: OpenCost
        level: advanced
        category: tool
      - name: Requests vs Usage Costing
        level: advanced
        category: core
      - name: Idle & Unallocated Capacity
        level: advanced
        category: core
      - name: Node Provisioning Efficiency
        level: advanced
        category: tool
      - name: Namespace Showback
        level: intermediate
        category: core
      - name: Cluster Rightsizing
        level: advanced
        category: core
      - name: Bin Packing & Scheduling Cost
        level: advanced
        category: core
    projects:
      - Deploy OpenCost on a real cluster and produce a per-namespace cost report that reconciles to the cloud provider's node bill
      - Quantify idle cluster capacity as a monetary figure, and decide who pays for it — the split you choose is the interesting part
      - Compare cost calculated from resource requests against cost from actual usage, and write down which one you would charge teams on and why
      - Find the worst over-requesting workload in a cluster, right-size it, and measure the node capacity reclaimed
      - Introduce a node provisioner such as Karpenter or cluster autoscaler tuning, then measure the change in cost per pod-hour
      - Build a namespace showback dashboard a platform team can hand to tenants without further explanation
