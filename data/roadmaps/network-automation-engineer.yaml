faq:
  - question: What does the Network Automation Engineer roadmap actually cover?
    answer: It runs from Git-based version control of device configs through Python for parsing and generating config, structured device APIs like NETCONF, RESTCONF and gNMI, Ansible for declarative configuration management, a NetBox source of truth, virtual labs with containerlab, CI testing with Batfish and pytest, scaling past Ansible with Nornir, closed-loop telemetry, and finally running automation as a trusted product for other teams.
  - question: How long does it take to become a network automation engineer?
    answer: SkillPilot's editorial estimate is 7-10 months at around 10 hours a week, spread across ten phases that range from 3 to 6 weeks each. The path assumes you already have working knowledge of TCP/IP, routing and switching, are comfortable configuring at least one vendor's devices from the CLI, and know basic Linux commands before starting.
  - question: How much does a network automation engineer earn?
    answer: In the US market, Glassdoor data puts entry-level pay at $105,017 (25th percentile), the average at $130,170, and senior roles averaging $157,504 — all figures retrieved 2026-08-17.
  - question: Why does this roadmap teach Git and version control before any scripting?
    answer: Because the real constraint in network automation is not pushing configuration, it is knowing what the configuration should be — a fast automation reading bad data just breaks the network faster. The first phase puts every configuration into Git, with branches, diffs, pull requests and rollback against real device configs, before any Python or Ansible is introduced.
  - question: Why does the roadmap treat testing as a separate, later phase instead of teaching it alongside Ansible?
    answer: Testing is presented as the phase most people skip, and also the one that separates a scripter from an engineer, because it makes a change reversible before it ships rather than after. It uses Batfish for pre-change validation and pytest-based assertions for post-change state, wired into CI so a change that would black-hole a prefix is rejected by a pipeline instead of by a customer.
  - question: When should a team move from Ansible to a tool like Nornir?
    answer: "The roadmap frames this as a scale question rather than a preference: at a few thousand devices, playbook runtime and Ansible's rigid task structure become the real constraint. Nornir keeps Python as the control flow and parallelises properly, but the roadmap is explicit that the swap must be justified by measured runtime and device count, not made for résumé-driven reasons."
