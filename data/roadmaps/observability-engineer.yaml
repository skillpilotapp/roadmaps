  - id: sampling
    title: Sampling Strategies
    description: Sampling is how you keep the interesting telemetry and drop the rest, and getting it wrong deletes the evidence for the incident you have not had yet. Done when you run tail-based sampling in production and can prove, against a held-out full-fidelity window, that every slow and every failed request survived. Head sampling is cheap and decides before it knows whether the request was interesting.
    duration: 3-4 weeks
    skills:
      - name: Head vs Tail Sampling
        level: advanced
        category: core
      - name: Tail Sampling Policies
        level: advanced
        category: tool
      - name: Sampling Bias Analysis
        level: advanced
        category: core
      - name: Statistical Reweighting
        level: advanced
        category: core
      - name: Consistent Sampling Decisions
        level: advanced
        category: core
      - name: Error & Latency Preservation
        level: advanced
        category: core
      - name: Sampling Verification
        level: advanced
        category: core
    projects:
      - Implement tail-based sampling with separate policies for errors, slow requests and a baseline of successes, and document each policy's intent
      - Run full fidelity and your sampling configuration side by side for a day, then prove no error trace and no p99 request was lost
      - Reweight sampled counts back to true traffic volume and reconcile the estimate against an unsampled counter
      - Find a sampling configuration that silently drops one customer's traffic entirely, and write the check that would have caught it
      - Make sampling decisions consistent across services so a trace is never half kept, and demonstrate a partial trace before and after
      - Compare the cost and the fidelity of head and tail sampling on the same workload, and write which you would run and under what volume you would switch
