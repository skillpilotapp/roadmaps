  - id: continuous-profiling
    title: Continuous Profiling
    description: The signal almost nobody has. Traces tell you which service was slow; profiles tell you which line of code burned the CPU while it was. Done when profiling runs continuously in production at acceptable overhead and you have used a flame graph to find a hot path that traces alone had only narrowed to a service. Profiling on demand finds nothing, because you enable it after the interesting minute has passed.
