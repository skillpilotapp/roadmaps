  - id: wide-events
    title: Wide Events as the Unit of Telemetry
    description: "The craft's central idea: emit one wide, richly dimensioned event per unit of work instead of scattering the story across counters and log lines. Done when a single service emits events carrying at least thirty attributes each, and you can answer a new question by filtering on a dimension rather than by deploying. Pre-aggregated metrics discard exactly the outliers you will be asked about."
    duration: 4-5 weeks
