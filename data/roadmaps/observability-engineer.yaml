  - id: telemetry-pipelines
    title: Telemetry Pipelines & Collectors
    description: The layer between what applications emit and where it lands, and the thing that turns telemetry from a per-service decision into infrastructure. Done when you run a collector fleet that receives, transforms, redacts and routes telemetry to more than one backend, survives a backend outage without losing data, and reports on its own health. A pipeline you cannot observe is a blind spot on the observability team.
