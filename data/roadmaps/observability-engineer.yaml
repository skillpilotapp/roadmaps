  - id: context-propagation
    title: Context Propagation Across Boundaries
    description: Wide events only compose into a story if they share a trace context, and context is what breaks first at every boundary you did not write. Done when one request keeps its trace context across an async queue, a thread pool and a third-party SDK, and you can name the exact library that dropped it when it broke. Baggage is how a dimension known at the edge reaches a service ten hops down.
    duration: 3-4 weeks
    skills:
      - name: Context Propagation
        level: advanced
        category: core
      - name: W3C Trace Context
        level: advanced
        category: core
      - name: Baggage Propagation
        level: advanced
        category: core
      - name: Async & Queue Boundaries
        level: advanced
        category: core
      - name: Span Design & Nesting
        level: advanced
        category: core
      - name: Cross-language Interop
        level: intermediate
        category: core
      - name: Broken Trace Debugging
        level: advanced
        category: core
      - name: OTLP Protocol
        level: intermediate
        category: tool
    projects:
      - Propagate trace context through a message queue so a producer span and its consumer span appear in one trace, and document the header you had to carry by hand
      - Break context propagation deliberately in a thread pool, observe the orphaned spans, then fix it and write the diagnostic that identified the gap
      - Use baggage to carry a customer tier attribute from the edge gateway to a service four hops downstream, and query events by it at the far end
      - Trace one request across two services written in different languages, and record every place the two SDKs disagreed about span naming
      - Audit a service's span hierarchy and cut the spans that carry no decision value — depth without information makes traces slower to read, not richer
      - Instrument a call through a third-party client library that does not propagate context, and write the wrapper that makes it behave
