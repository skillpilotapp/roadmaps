  - id: telemetry-cost
    title: Telemetry Cost as a Design Constraint
    description: Every attribute you add has a price, and observability budgets are cut by finance, not by engineers. This phase makes cost a first-class input rather than a quarterly surprise. Done when you can state the cost per million events for your own pipeline, attribute the bill to the services generating it, and cut it by a third while naming exactly which question you gave up answering.
