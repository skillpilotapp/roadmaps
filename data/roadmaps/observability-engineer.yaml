phases:
  - id: observability-vs-monitoring
    title: Observability vs Monitoring
    description: Monitoring answers questions you wrote down in advance. Observability is the property that lets you answer one nobody anticipated, without shipping new code first. Done when you take a live service, ask three questions its dashboards were never built for, and record which ones its telemetry can already answer. The unanswerable ones define the rest of this roadmap.
    duration: 2-3 weeks
    skills:
      - name: Observability vs Monitoring
        level: intermediate
        category: core
      - name: Cardinality & Dimensionality
        level: advanced
        category: core
      - name: Unknown-unknowns Debugging
        level: advanced
        category: core
      - name: Signal Taxonomy
        level: intermediate
        category: core
      - name: Telemetry Data Models
        level: intermediate
        category: core
      - name: Question-driven Design
        level: advanced
        category: core
      - name: Debugging from First Principles
        level: advanced
        category: core
    projects:
      - Take a service you did not build, write down three questions its dashboards cannot answer, and classify each as missing signal, missing dimension or missing correlation
      - Reproduce a bug that only affects one customer, and record every point where you had to add code or SSH somewhere to make progress
      - Write the one-page distinction between monitoring and observability you would give a sceptical engineering manager, without using the word platform
      - Take one existing dashboard and list what it would take to slice every panel by customer, region and build version — the cost estimate is the deliverable
      - Catalogue every telemetry signal a single service emits today, with its data model, its owner and whether anyone queried it in the last quarter
      - Find a past incident whose diagnosis needed a code deploy to add a log line, and write what dimension would have made the deploy unnecessary
