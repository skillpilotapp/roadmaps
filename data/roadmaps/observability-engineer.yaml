  - id: query-and-analysis
    title: Query & High-Cardinality Analysis
    description: "Telemetry you cannot interrogate quickly is an archive. This phase is the analytical craft: slicing by high-cardinality dimensions until an anomaly resolves into a population. Done when you take an unexplained latency spike and identify the shared attribute of the affected requests through query alone, in under fifteen minutes, with no prior hypothesis about the cause."
