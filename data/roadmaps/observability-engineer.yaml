faq:
  - question: How is observability engineering different from SRE?
    answer: "The two roles split the same problem differently: an SRE decides what reliability to target, while an observability engineer builds the system that can answer why a target was missed. This path assumes you have already shipped services and used a metrics or logging tool, but have never owned the telemetry itself as a craft of its own."
  - question: What does the observability engineer roadmap actually cover?
    answer: "It runs from the distinction between monitoring and observability through wide events, context propagation, signal correlation, telemetry cost, sampling, query and high-cardinality analysis, collector pipelines, running observability as a platform, and continuous profiling. The ordering is deliberate: wide events come early because you cannot ask a question of data you already aggregated away, and dashboards do not get their own phase because they only answer questions you already knew to ask."
  - question: Why does the roadmap put wide events before dashboards?
    answer: A pre-aggregated metric discards exactly the outliers you will later be asked about, so the roadmap teaches emitting one wide, richly dimensioned event per unit of work instead of scattering the story across counters and log lines. The mark of success is being able to answer a new question by filtering on a dimension rather than by shipping new code.
  - question: How long does it take to become an observability engineer, and how much does it pay?
    answer: SkillPilot's editorial estimate is 6-8 months at 10 hours a week. In the United States, Glassdoor's Observability Engineer total pay data (27 salaries submitted) puts entry pay around $135,441, the average around $164,046, and senior pay around $202,686.
  - question: Why is telemetry cost treated as its own phase instead of an afterthought?
    answer: Every attribute added to telemetry has a price, and observability budgets get cut by finance rather than by engineers, so the roadmap makes cost a first-class design input rather than a quarterly surprise. Being done with this phase means you can state the cost per million events for your own pipeline, attribute the bill to the services generating it, and cut it by a third while naming exactly which question you gave up answering.
  - question: What do I need to know before starting this roadmap?
    answer: You need working knowledge of Linux, containers and HTTP services, comfort reading and writing code in at least one language, and some prior exposure to a metrics or logging tool running in production. It is pitched as an advanced-level path, not an entry point into engineering generally.
