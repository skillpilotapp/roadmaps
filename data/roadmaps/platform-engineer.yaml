faq:
  - question: What is a platform engineer, and how is it different from DevOps?
    answer: A platform engineer builds an internal developer platform as a product, where the customers are engineers who can choose to ignore it. It is the move DevOps engineers make when the bottleneck stops being the pipeline itself and starts being everyone else's pipeline — the job shifts from running production systems to designing the paved road other teams use to reach production.
  - question: What are the prerequisites for the Platform Engineer roadmap?
    answer: You need two or more years running production systems as a DevOps or infrastructure engineer, working Kubernetes knowledge — deploying, debugging and rolling back a workload — and fluency with at least one infrastructure-as-code tool and one CI system. Comfort writing code in Go, Python or TypeScript is also assumed, since phase three onward requires building a controller rather than only configuring one.
  - question: How long does the Platform Engineer roadmap take?
    answer: Expect 8-11 months at around 10 hours a week, spread across ten phases. Phase two, Kubernetes as a Substrate, is the longest at 5-7 weeks, because everything built in later phases fails in ways you need to be able to debug at that layer.
  - question: How much does a platform engineer earn?
    answer: In the United States, entry-level platform engineers (1-2 years experience) earn around $105,062, mid-level (2-4 years) around $130,978, and senior (5-8 years) around $165,664, according to Salary.com's Platform Engineer salary report. Figures are sourced per level and reflect the US market specifically.
  - question: Why does the developer portal come after golden paths in this roadmap, not before?
    answer: The roadmap orders golden paths before the developer portal because a catalogue of services nobody wants to use is just a directory — the portal is the front door, but there needs to be somewhere worthwhile for it to lead. Adoption is likewise treated as its own final phase rather than an afterthought, since a platform nobody adopts is a side project with a Kubernetes bill, not a platform.
  - question: What does the Policy as Code & Guardrails phase actually cover?
    answer: It covers admission policy, provisioning controls and writing rejection messages that tell the author how to comply, using tools like Open Policy Agent and Kyverno. The phase is considered done when a policy you wrote has blocked a real non-compliant change, the author fixed it from the error message alone without contacting you, and you can state the policy's false-positive rate.
