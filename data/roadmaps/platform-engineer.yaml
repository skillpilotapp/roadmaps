  - id: gitops-delivery
    title: CI/CD & GitOps Delivery
    description: Deployment becomes a property of a repository rather than a job someone runs. Pull-based reconciliation, environment promotion, secrets that never sit in Git, and rollbacks that are a revert. Done when a service deploys to production purely by merging to a branch, and you can point at the exact commit that produced what is running right now.
    duration: 4-6 weeks
    skills:
      - name: GitOps Principles
        level: advanced
