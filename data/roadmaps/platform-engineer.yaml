  - id: kubernetes-substrate
    title: Kubernetes as a Substrate
    description: Most platforms sit on Kubernetes, and platform engineers are on the operating side of it, not the deploying side. Control planes, extension points, the reconciliation loop, and what breaks a cluster other teams depend on. Done when you have written a controller that reconciles a custom resource you defined, and can explain what happens to it when the API server is briefly unavailable.
    duration: 5-7 weeks
    skills:
      - name: Kubernetes Control Plane Internals
        level: advanced
        category: core
      - name: Custom Resource Definitions
        level: advanced
        category: core
      - name: Controllers & Reconciliation Loops
        level: advanced
        category: core
      - name: Operator Pattern
        level: advanced
        category: tool
      - name: Admission Control
        level: advanced
        category: core
      - name: API Aggregation
        level: intermediate
        category: core
