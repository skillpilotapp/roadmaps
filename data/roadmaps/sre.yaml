  - id: incident-learning
    title: Postmortems & Organisational Learning
    description: "Where an outage stops being a loss. Done when you have run a postmortem that produced action items someone actually completed — an unowned action item is a wish with a due date. The document explains what made the failure possible, never who typed the command: a blameful postmortem teaches everyone present to report less next time."
    duration: 2-3 weeks
    skills:
      - name: Blameless Postmortems
