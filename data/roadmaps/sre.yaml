  - id: tracing-logging
    title: Tracing, Logging & Debugging Production
    description: Metrics tell you something is wrong; traces and logs tell you where and why. Done when you can follow one request across service boundaries in a single trace and answer a question about last week from telemetry alone — no SSH, no log files on disk. Monitoring answers questions you knew to ask; this phase is what lets you ask new ones mid-incident.
    duration: 4-6 weeks
    skills:
