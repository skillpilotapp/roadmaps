  - id: instrumentation-metrics
    title: Instrumentation & Metrics
    description: "An SLO with no instrumentation is a wish. This phase is about producing the signal: what to measure, how to name it, and what it costs to keep. Done when a service you instrumented can answer a question you had not thought of when you instrumented it. Averages hide the users you are failing — if you only learn one thing here, make it percentiles."
    duration: 4-6 weeks
    skills:
      - name: Metrics & Instrumentation
        level: advanced
        category: core
      - name: Prometheus & PromQL
        level: advanced
