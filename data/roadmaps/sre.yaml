    description: "What you do while the system is broken and people are watching. Done when you have run an incident as commander without touching a terminal — the commander who starts debugging stops coordinating. Roles beat heroics: an incident with a named commander, a scribe and a comms lead resolves faster than one with five engineers all fixing the same thing."
