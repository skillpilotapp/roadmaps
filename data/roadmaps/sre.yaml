  - id: data-reliability
    title: Data & Stateful Systems Reliability
    description: "Stateless services are the easy half. Done when you have restored a database from backup into a clean environment and recorded the real recovery time — a backup nobody has restored is a hypothesis, not a backup. Data has a property compute does not: you can lose it permanently, so the failure modes here are the ones that end companies."
    duration: 4-6 weeks
    skills:
      - name: Replication & Consistency Models
        level: advanced
        category: core
      - name: Backup & Restore Verification
        level: advanced
        category: core
      - name: RTO & RPO Definition
        level: advanced
        category: core
      - name: Zero-downtime Migrations
        level: advanced
        category: core
      - name: Data Integrity & Corruption
        level: advanced
        category: core
      - name: Database Failover
        level: advanced
        category: core
      - name: Connection Pooling & Saturation
        level: intermediate
        category: core
      - name: Stateful Workloads on Kubernetes
        level: intermediate
        category: tool
    projects:
      - Restore a production-sized database from backups into a clean environment and record the real recovery time, not the estimated one
      - Run a schema migration on a live table with no downtime, using expand-and-contract, and document the rollback path at each step
      - Trigger a database failover under write load and measure exactly how much data and how many seconds were lost
      - Define RTO and RPO for one stateful service, then test whether your current setup actually meets them — most do not
      - Detect a deliberately introduced data corruption using checksums or reconciliation, and write the runbook for how it would be caught in production
      - Exhaust a connection pool under load and document what the application did — the failure mode is rarely the one people expect
