  - id: alerting-on-slos
    title: Alerting on SLOs & On-Call Health
    description: The bridge between telemetry and a human being woken up. Done when every page in your rotation is actionable and you can defend each one, and when you have deleted an alert someone else wrote. An alert that fires without a clear action trains people to ignore alerts — alert fatigue is not a personality flaw, it is a design defect.
    duration: 3-4 weeks
    skills:
      - name: Alert Design
        level: advanced
        category: core
      - name: Burn-rate Alerting
        level: advanced
        category: core
      - name: Multi-window Multi-burn-rate
        level: advanced
        category: core
      - name: Symptom vs Cause Alerting
        level: advanced
        category: core
      - name: Alert Fatigue Management
        level: advanced
        category: core
      - name: On-Call Rotation Design
        level: intermediate
        category: core
      - name: Escalation Policies
        level: intermediate
        category: core
      - name: Runbook Authoring
        level: intermediate
        category: core
    projects:
      - Replace a static threshold alert with a multi-window burn-rate alert and explain what each window is designed to catch
      - Audit an alerting setup and cut false positives by at least half, proving no real incident would have been missed
      - "Review three months of pages: how many were actionable, and what would you delete?"
      - Write a runbook for one service, then have someone unfamiliar with it follow the runbook during a simulated incident — the gaps they hit are the real output
      - Write an on-call rotation policy covering escalation, handoff and burnout rules for a four-person team
      - Convert a cause-based alert ("disk is 80% full") into a symptom-based one ("users are seeing errors") and argue which you would rather be woken by
