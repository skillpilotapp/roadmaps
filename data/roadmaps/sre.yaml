phases:
  - id: reliability-foundations
    title: Reliability Foundations
    description: The vocabulary that makes every later conversation precise. Done when you can write an SLO for a service you did not build, defend the target against "why not higher?", and say what happens when the budget runs out. Targets come from what users need, not from what the system currently does — setting the SLO at current performance guarantees no work is ever safe.
    duration: 3-4 weeks
    skills:
      - name: SLI Selection
        level: advanced
        category: core
      - name: SLO Design
        level: advanced
        category: core
      - name: Error Budgets & Burn Rate
        level: advanced
        category: core
      - name: SLA vs SLO Distinction
        level: intermediate
        category: core
      - name: Availability Arithmetic
        level: intermediate
        category: core
      - name: Risk & Tradeoff Analysis
        level: intermediate
        category: core
      - name: Reliability Economics
        level: intermediate
        category: core
      - name: Stakeholder Negotiation
        level: intermediate
        category: core
    projects:
      - Define SLIs and SLOs for a checkout API, including a written error-budget policy stating exactly what stops when the budget is exhausted and who decides
      - Take a service you did not build and write its SLO from the outside, then defend the number against both "why not higher?" and "why not lower?"
      - Calculate the permitted downtime for 99%, 99.9%, 99.95% and 99.99% and write down what each would actually cost to defend
      - Find a service whose current performance was quietly adopted as its target, and write the argument for what the target should be instead
      - Write the one-page error-budget policy you would actually take to a product manager, in language that survives contact with someone who does not care about percentiles
      - Pick a real outage from a public postmortem and work out what it cost in error budget — then say whether the SLO was set correctly
