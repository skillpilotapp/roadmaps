jobReality:
  dayToDay: "Less firefighting than the job's reputation suggests, and more writing. A normal week is reviewing other teams' launch plans against their error budgets, extending automation so a manual runbook step stops needing a human, and arguing about whether a proposed SLO reflects what users notice. On-call is the exception rather than the shape of the role: a healthy rotation is quiet, and a rotation that is not quiet is the problem you are being paid to fix. The uncomfortable part is that most of your influence is exercised over teams you do not manage, through a budget number they agreed to before anything broke."
  interview: "Three recognisable rounds. A debugging or incident exercise where you are handed a misbehaving system and watched for how you narrow the problem — the reasoning is being scored, not the answer. A systems design round pitched at failure rather than throughput: what happens when this dependency is slow, what does the client do, how do you know before your users tell you. And a behavioural round built almost entirely on real incidents, where the expected answer names what you got wrong and what changed afterwards; a story with no mistake in it reads as a story that was rehearsed. Expect SLO and error-budget vocabulary to be probed for whether you have set one, not whether you can define one."
  entryPaths: Almost nobody starts here — the prerequisites say Linux, cloud and code for a reason. The three common origins are backend engineers who kept getting pulled into production problems and found they preferred them, systems administrators or ops engineers formalising what they already do, and DevOps engineers moving from building pipelines toward owning service behaviour. If you are on the DevOps engineer path, phases one and four here are the specialisation. Coming from the data side, database reliability engineering shares this roadmap's phase eight and diverges after it. What transfers from any of them is production instinct; what does not is the assumption that reliability is a maximum rather than a target.
  progression: The ladder forks rather than continuing straight. Staff and principal SREs stay technical and widen their blast radius, owning reliability standards across an organisation instead of services — which is phase ten as a full-time job. The second fork is platform or infrastructure engineering, where the product becomes the thing other engineers build on. The third is management of an SRE org, which trades the debugging for headcount and on-call sustainability. Salary data on this page stops at senior because that is where public estimates stop being reliable, not because the ladder does.
  failureModes: "Two, and both are structural rather than technical. The first is joining an organisation that wanted a rebranded operations team: if nobody will let you spend an error budget, or every incident review ends with a name rather than a change, the title is the only part of the job you actually got. Ask in the interview who last blocked a launch and what happened. The second is on-call that never gets better, which is the same failure seen from underneath — pages that are not actionable, a rotation too thin to absorb one bad week, and no time budgeted to fix any of it. Burnout here is not a resilience problem, it is an unspent budget."
