  - id: capacity-and-cost
    title: Capacity Planning & Cost Efficiency
    description: Reliability you cannot afford is not reliability. Done when you have forecast demand, sized infrastructure from that forecast rather than from habit, and cut spend without moving your SLO. Overprovisioning hides design problems and bills you monthly for the privilege — the goal is headroom you chose deliberately, not headroom you inherited.
    duration: 3-4 weeks
    skills:
      - name: Capacity Planning
        level: advanced
        category: core
      - name: Demand Forecasting
        level: advanced
        category: core
      - name: Load Shedding
        level: advanced
        category: core
      - name: Autoscaling Design
        level: advanced
        category: core
      - name: Resource Limits & Requests
        level: intermediate
        category: tool
      - name: Cost Attribution & FinOps
        level: intermediate
        category: core
      - name: Performance Bottleneck Analysis
        level: advanced
        category: core
      - name: Queueing & Backpressure
        level: advanced
        category: core
    projects:
      - Run a capacity exercise forecasting infrastructure for 3x traffic growth over six months, showing the arithmetic rather than a guess
      - Load-test a service to the point of failure and record which resource ran out first — it is rarely the one you sized for
      - Implement load shedding so the service degrades predictably under overload instead of collapsing, and prove it with a load test
      - Cut infrastructure spend by 20% on one service without changing its SLO, and document what headroom you gave up
      - Right-size Kubernetes requests and limits from observed usage rather than from the defaults someone copied, and measure the reclaimed capacity
      - Tune an autoscaler until it responds to a real traffic spike without flapping — then write down the tradeoff you settled on
