faq:
  - question: How long does it take to become an SRE, and what should I know first?
    answer: The full path runs 8-11 months at around 10 hours a week across ten phases. You should already have working knowledge of Linux and the command line, some basic cloud infrastructure experience with VMs and networking, and be comfortable reading and writing code in at least one language before starting.
  - question: What does an SRE roadmap actually cover?
    answer: "It moves from reliability foundations — SLIs, SLOs and error budgets — into instrumentation with metrics, then tracing and logging, alerting, automation and toil reduction, incident response, postmortems, data and stateful systems reliability, capacity planning, and finally reliability at platform scale. Phase order matters: instrumentation comes before alerting because you cannot alert on a signal you do not have, and incidents come before postmortems because a postmortem process with no incidents to feed it is only a template."
  - question: How much does a site reliability engineer earn?
    answer: In the United States, entry-level SRE pay ranges from about $95,000 to $161,000 for candidates with up to a year of experience, according to Glassdoor. The overall average sits around $172,508, and senior SREs average about $185,489.
  - question: What do SRE interviews ask?
    answer: Three rounds are near-universal. A debugging or incident exercise where you are handed a misbehaving system and scored on how you narrow the problem rather than on reaching the answer. A systems design round pitched at failure rather than throughput — what happens when a dependency is slow, and how you find out before users tell you. And a behavioural round built on real incidents, where naming what you got wrong and what changed afterwards is the expected answer. SLO and error-budget vocabulary gets probed for whether you have actually set one, not whether you can define it.
  - question: How do you become an SRE, and what job do most people come from?
    answer: Almost nobody starts here directly. The three common origins are backend engineers who kept being pulled into production problems and found they preferred them, systems administrators and ops engineers formalising work they already do, and DevOps engineers moving from building pipelines toward owning service behaviour. What transfers is production instinct; what does not is the habit of treating reliability as a maximum to chase rather than a target you choose. The roadmap assumes Linux, basic cloud infrastructure and comfort reading code before phase one.
  - question: What comes after senior SRE?
    answer: The ladder forks rather than continuing straight. Staff and principal SREs stay technical and own reliability standards across an organisation instead of individual services, which is this roadmap's tenth phase as a full-time job. The second fork is platform or infrastructure engineering, where the product becomes what other engineers build on. The third is managing an SRE organisation, trading debugging for headcount and on-call sustainability. Public salary estimates stop at senior because that is where the data thins, not because the ladder ends.
  - question: Why do people leave SRE jobs?
    answer: "Usually for one structural reason with two faces. The first is joining a team that wanted a rebranded operations function — if nobody will let you spend an error budget, or incident reviews end with a name rather than a change, the title is the only part of the role you got. The second is on-call that never improves: pages that are not actionable, a rotation too thin to absorb one bad week, and no time budgeted to fix either. Burnout in this role is rarely a resilience problem; it is an unspent error budget."
  - question: Which phase of the SRE path is hardest, and why?
    answer: Data and stateful systems reliability is described as the wall in this roadmap, because stateless services are the easy half of the job. It only counts as done once you have restored a database from backup into a clean environment and recorded the real recovery time, since a backup nobody has restored is a hypothesis, not a backup.
